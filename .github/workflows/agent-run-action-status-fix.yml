name: Agent Run Action Status Fix

on:
  push:
    branches:
      - agent/action-run-status
    paths:
      - .github/workflows/agent-run-action-status-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/action-run-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixer
        run: node scripts/agent-fix-action-status.js
      - name: Validate JavaScript
        run: node --check /tmp/app.js
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix and validate live action status tracking"
          git push origin HEAD:agent/action-run-status
