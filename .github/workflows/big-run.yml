name: Big Run

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  big-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          workflows=(
            "disco-power-tools-main.yml"
            "enrich-power-main.yml"
            "disco-trusted-sellers.yml"
            "enrich-trusted-sellers.yml"
            "discovery-dudes-power.yml"
            "enrich-power.yml"
            "disco-woodworking-test.yml"
            "enrich-woodworking-test.yml"
            "keepa-token-check.yml"
          )

          for workflow in "${workflows[@]}"; do
            echo "Starting $workflow..."

            gh workflow run "$workflow" --ref "${{ github.ref_name }}"

            sleep 10

            run_id=$(gh run list \
              --workflow "$workflow" \
              --branch "${{ github.ref_name }}" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

            gh run watch "$run_id"

            conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion')

            if [[ "$conclusion" != "success" ]]; then
              echo "$workflow failed with conclusion: $conclusion"
              exit 1
            fi

            echo "$workflow complete."
          done
