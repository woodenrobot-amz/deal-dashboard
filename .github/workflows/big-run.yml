name: Big Run

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  big-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          workflows=(
            "disco-power-tools-main.yml"
            "enrich-power-main.yml"
            "disco-trusted-sellers.yml"
            "enrich-trusted-sellers.yml"
            "discovery-dudes-power.yml"
            "enrich-power.yml"
            "disco-woodworking-test.yml"
            "enrich-woodworking-test.yml"
            "keepa-token-check.yml"
          )

          max_attempts=3

          for workflow in "${workflows[@]}"; do
            attempt=1

            while (( attempt <= max_attempts )); do
              echo "Starting $workflow (attempt $attempt/$max_attempts)..."

              gh workflow run "$workflow" --ref "${{ github.ref_name }}"

              sleep 10

              run_id=$(gh run list \
                --workflow "$workflow" \
                --branch "${{ github.ref_name }}" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId')

              gh run watch "$run_id" || true

              conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion')

              if [[ "$conclusion" == "success" ]]; then
                echo "$workflow complete."
                break
              fi

              echo "$workflow failed with conclusion: $conclusion"

              logs=$(gh run view "$run_id" --log 2>&1 || true)

              if grep -q "429 Too Many Requests" <<< "$logs"; then
                if (( attempt == max_attempts )); then
                  echo "$workflow is still being throttled by Keepa after $max_attempts attempts."
                  exit 1
                fi

                wait_seconds=$((60 * attempt))
                echo "Keepa returned 429 Too Many Requests. Waiting ${wait_seconds}s for tokens to replenish before retrying..."
                sleep "$wait_seconds"
                ((attempt++))
                continue
              fi

              echo "$workflow failed for a non-throttling reason; not retrying."
              exit 1
            done
          done
