name: Clean Discovered ASINs

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab
  push:
    paths:
      - 'data/discovered-asins.json' # Triggers automatically if the file changes

jobs:
  clean-json:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Grants permission to push the changes back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deduplicate and sort ASINs
        run: |
          if [ -f "data/discovered-asins.json" ]; then
            echo "Processing data/discovered-asins.json..."
            
            # Using jq to read the array, unique it (which sorts it), and overwrite the file
            jq 'unique' data/discovered-asins.json > temp.json && mv temp.json data/discovered-asins.json
            
            echo "Cleanup complete."
          else
            echo "Error: data/discovered-asins.json not found!"
            exit 1
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: scrubbed and deduplicated discovered-asins.json"
          file_pattern: 'data/discovered-asins.json'
