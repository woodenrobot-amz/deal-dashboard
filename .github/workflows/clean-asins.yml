name: Scrub Discovered ASINs

on:
  workflow_dispatch: # Best kept as a manual trigger so it doesn't accidentally wipe data automatically

jobs:
  clear-json:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reset JSON file to empty array
        run: |
          if [ -f "data/discovered-asins.json" ]; then
            echo "Wiping data/discovered-asins.json..."
            
            # This instantly overwrites the file with a clean, empty JSON array
            echo "[]" > data/discovered-asins.json
            
            echo "Scrub complete. File reset to []"
          else
            echo "Error: data/discovered-asins.json not found!"
            exit 1
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: completely scrubbed and reset discovered-asins.json"
          file_pattern: 'data/discovered-asins.json'
