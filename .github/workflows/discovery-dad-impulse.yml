name: Disco Dad Impulse

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-discovery-dad-impulse
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run dad impulse discovery
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CAPTURE_KEEPA_STATUS: "1"
        run: node scripts/keepa-discovery.js dad_impulse

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: dad-impulse-discovery-results
          path: data/discovered-asins.json

      - name: Commit discovery results
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"
          git add data/discovered-asins.json
          git add data/keepa-status.json
          git diff --cached --quiet || git commit -m "update dad impulse discovery"
          git push
