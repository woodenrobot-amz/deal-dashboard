name: Keepa Discovery Woodworking Core

on:
  schedule:
    # 4:07 AM Eastern
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-discovery-woodworking-core
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run woodworking core discovery
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/keepa-discovery.js woodworking_core

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: woodworking-core-discovery-results
          path: data/discovered-asins.json

      - name: Commit discovery results
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"
          git add data/discovered-asins.json
          git diff --cached --quiet || git commit -m "update woodworking core discovery"
          git push
