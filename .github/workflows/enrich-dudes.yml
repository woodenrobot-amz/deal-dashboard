name: Enrich Deals For Dudes

on:
  schedule:
    # 7:15 AM Eastern Daylight Time
    - cron: "20 11 * * *"

    # 10:15 AM EDT
    - cron: "20 14 * * *"

    # 1:15 PM EDT
    - cron: "20 17 * * *"

# 4:20 PM EDT
- cron: "20 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-enrich-dudes
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run dude deal enrichment
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/enrich-stream.js deals_for_dudes

      - name: Commit enrichment results
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"

          git add data/deals.json
          git add data/discovered-asins.json

          git diff --cached --quiet || git commit -m "enrich deals for dudes"

          git pull --rebase origin main
          git push
