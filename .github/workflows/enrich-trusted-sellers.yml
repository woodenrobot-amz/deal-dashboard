name: Enrich Trusted Sellers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-enrich-trusted-sellers
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run trusted sellers enrichment
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/enrich-stream.js trusted_sellers

      - name: Commit enrichment results
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"

          git add data/deals.json
          git add data/discovered-asins.json

          git diff --cached --quiet || git commit -m "enrich trusted sellers deals"

          git push
