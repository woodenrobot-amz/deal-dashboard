name: Enrich Woodworking Core Deals

on:
  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-enrich-woodworking-core
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run woodworking core enrichment
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/enrich-stream.js woodworking_core

      - name: Commit enrichment results
        run: |
            git config user.name "keepa-bot"
            git config user.email "keepa-bot@users.noreply.github.com"

            git add data/deals.json
            git add data/discovered-asins.json

            if git diff --cached --quiet; then
                echo "No changes to commit"
                exit 0
            fi

            git commit -m "enrich deals"

            git pull --rebase origin main
            git push
