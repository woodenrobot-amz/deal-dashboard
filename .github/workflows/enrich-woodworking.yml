name: Enrich Woodworking Deals

on:
  schedule:
    # 6:20 AM EDT (10:20 UTC)
    - cron: "20 10 * * *"

    # 9:20 AM EDT (13:20 UTC)
    - cron: "20 13 * * *"

    # 12:20 PM EDT (16:20 UTC)
    - cron: "20 16 * * *"

    # 3:20 PM EDT (19:20 UTC)
    - cron: "20 19 * * *"

    # 6:20 PM EDT (22:20 UTC)
    - cron: "20 22 * * *"

    # 9:20 PM EDT (01:20 UTC next day)
    - cron: "20 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-enrich-woodworking
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Changed to standard LTS for stability, switch back to 24 if strictly required

      - name: Run woodworking enrichment
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/enrich-stream.js woodworking

      - name: Commit enrichment results
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"

          git add data/deals.json
          git add data/discovered-asins.json

          # Only commit and push if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "enrich woodworking deals"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
