name: Enrich Woodworking Deals

on:
  schedule:
    # 6:20 AM Eastern Daylight Time
    - cron: "20 10 * * *"

    # 9:20 AM EDT
    - cron: "20 13 * * *"

    # 12:20 PM EDT
    - cron: "20 16 * * *"

    # 03:20 PM EDT
    - cron: "20 19 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-enrich-woodworking
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run woodworking enrichment
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/enrich-stream.js woodworking

      - name: Commit enrichment results
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"

          git add data/deals.json
          git add data/discovered-asins.json

          git diff --cached --quiet || git commit -m "enrich woodworking deals"

          git pull --rebase origin main
          git push
