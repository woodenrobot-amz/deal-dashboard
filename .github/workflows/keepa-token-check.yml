name: Check Keepa Tokens

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepa-token-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Keepa token balance
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: node scripts/check-keepa-tokens.js

      - name: Commit token status
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"
          git add data/keepa-status.json
          git diff --cached --quiet || git commit -m "update Keepa token status"
          git pull --rebase origin main
          git push
