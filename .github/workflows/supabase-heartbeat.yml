name: Supabase Project Heartbeat

on:
  schedule:
    # Four lightweight database requests per day, spaced six hours apart.
    # Avoid the top of the hour because scheduled Actions are more likely to be delayed there.
    - cron: "17 4,10,16,22 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

          # SUPABASE_URL is not sensitive, but keep supporting it as a repository secret.
          # If it is absent, legacy Supabase service-role JWTs contain the project ref,
          # which lets us reconstruct https://<project-ref>.supabase.co without another secret.
          if [[ -z "${SUPABASE_URL:-}" ]]; then
            JWT_PAYLOAD="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | cut -d. -f2)"
            JWT_PAYLOAD="${JWT_PAYLOAD//-/+}"
            JWT_PAYLOAD="${JWT_PAYLOAD//_/\/}"

            case $((${#JWT_PAYLOAD} % 4)) in
              2) JWT_PAYLOAD="${JWT_PAYLOAD}==" ;;
              3) JWT_PAYLOAD="${JWT_PAYLOAD}=" ;;
              1)
                echo "::error::Could not decode the service-role key. Add a SUPABASE_URL repository secret."
                exit 1
                ;;
            esac

            PROJECT_REF="$(printf '%s' "$JWT_PAYLOAD" | base64 --decode 2>/dev/null | jq -r '.ref // empty' || true)"

            if [[ -z "$PROJECT_REF" ]]; then
              echo "::error::SUPABASE_URL is not configured and the project ref could not be derived from the service-role key. Add a SUPABASE_URL repository secret."
              exit 1
            fi

            SUPABASE_URL="https://${PROJECT_REF}.supabase.co"
            echo "Resolved Supabase project URL from the service-role key."
          fi

          SUPABASE_URL="${SUPABASE_URL%/}"
          RESPONSE_BODY="$(mktemp)"

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            --output "$RESPONSE_BODY" \
            --write-out '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/deals?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")"

          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "206" ]]; then
            echo "::error::Supabase heartbeat request failed with HTTP ${HTTP_CODE}."
            cat "$RESPONSE_BODY"
            exit 1
          fi

          echo "Supabase heartbeat completed successfully at $(date -u +'%Y-%m-%dT%H:%M:%SZ') (HTTP ${HTTP_CODE})."
