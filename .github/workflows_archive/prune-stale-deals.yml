name: Prune Stale Deals

on:
  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune-stale-deals
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale enriched deals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify files
        run: |
          echo "Current directory:"
          pwd
          echo "Data directory:"
          ls -la data || true
          echo "Scripts directory:"
          ls -la scripts || true

      - name: Run prune script
        run: node scripts/prune-stale-deals.js

      - name: Commit and push changes
        run: |
          git config user.name "keepa-bot"
          git config user.email "keepa-bot@users.noreply.github.com"

          if git diff --quiet; then
            echo "No stale deals to prune."
            exit 0
          fi

          git add data/*.json
          git commit -m "Prune stale enriched deals"
          git push
