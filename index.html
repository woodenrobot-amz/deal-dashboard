<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wooden Robot Deals</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --text: #f2f4f8;
      --muted: #9aa4b2;
      --border: #2b3240;
      --accent: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --good: #22c55e;
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15, 17, 21, 0.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 14px 10px;
}

.top-row {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

h1 {
  margin: 0;
  font-size: 1.1rem;
  letter-spacing: 0.02em;
}

.deal-count {
  color: var(--muted);
  font-size: 0.85rem;
  white-space: nowrap;
}

.search-wrap {
  position: relative;
  width: 100%;
}

#searchInput {
  width: 100%;
  padding: 12px 42px 12px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  outline: none;
  font-size: 1rem;
}

#searchInput:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
}

#clearSearchBtn {
  position: absolute;
  right: 7px;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: none;
  line-height: 1;
}

#clearSearchBtn:hover {
  color: var(--text);
  background: #2a3140;
}

.filter-section {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.filter-section::-webkit-scrollbar {
  display: none;
}

.tag-pill {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 0.88rem;
}

.tag-pill.active {
  background: var(--accent);
  color: #16100a;
  border-color: var(--accent);
  font-weight: 700;
}

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 16px 14px 90px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 0.86rem;
}

.toolbar button {
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--panel);
  border-radius: 999px;
  padding: 8px 11px;
  cursor: pointer;
}

.toolbar button:hover {
  color: var(--text);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
}

.deal-card {
  position: relative;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.deal-card.hidden-local {
  display: none;
}

.image-wrap {
  aspect-ratio: 1 / 1;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}

.image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.card-body {
  padding: 12px;
}

.title {
  margin: 0 0 8px;
  font-size: 0.96rem;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 3.6em;
}

.meta-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.price {
  color: var(--good);
  font-size: 1.2rem;
  font-weight: 800;
}

.asin {
  color: var(--muted);
  font-size: 0.75rem;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 9px 0 12px;
}

.mini-tag {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 0.74rem;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.actions a,
.actions button {
  text-align: center;
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 9px 10px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  font-size: 0.86rem;
}

.buy-btn {
  color: #17110a;
  background: var(--accent);
  border-color: var(--accent) !important;
}

.hide-btn {
  background: var(--panel-2);
  color: var(--text);
}

.junk-btn {
  grid-column: 1 / -1;
  background: var(--danger-bg);
  color: #fecaca;
  border-color: rgba(239, 68, 68, 0.35) !important;
}

.empty-state {
  border: 1px dashed var(--border);
  border-radius: 18px;
  color: var(--muted);
  padding: 32px 18px;
  text-align: center;
  background: rgba(255,255,255,0.02);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  background: #111827;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  z-index: 40;
  display: none;
  max-width: calc(100% - 28px);
  text-align: center;
  font-size: 0.9rem;
}

@media (min-width: 760px) {
  header {
    padding: 16px 22px 12px;
  }

  main {
    padding: 20px 22px 100px;
  }

  h1 {
    font-size: 1.35rem;
  }
}

  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <h1>Wooden Robot Deals</h1>
      <div class="deal-count" id="dealCount">0 deals</div>
    </div><div class="search-wrap">
  <input id="searchInput" type="search" placeholder="Search deals, brands, ASINs..." autocomplete="off" />
  <button id="clearSearchBtn" type="button" aria-label="Clear search">×</button>
</div>

<div class="filter-section" id="tagFilters" aria-label="Filter by tag"></div>

  </header>  <main>
    <div class="toolbar">
      <span id="activeFilterLabel">Showing all tags</span>
      <button id="showIgnoredBtn" type="button">Ignored ASINs</button>
    </div><section id="dealGrid" class="grid"></section>
<section id="emptyState" class="empty-state" style="display:none;">No matching deals found.</section>

  </main>  <div id="toast" class="toast"></div>  <script>
    /********************************************************************
     * Wooden Robot PWA immediate UI improvements
     *
     * Adds:
     * 1. Quick-clear search button
     * 2. Hide card locally
     * 3. Mark ASIN as junk/ignored so it won't display again
     * 4. Restores filtering by tags instead of deal streams
     * 5. Normalizes Three D Printing -> 3D Printing
     *
     * Data expectations:
     * window.DEALS can be injected before this script, or deals can be
     * loaded from ./data/deals.json.
     ********************************************************************/

    const STORAGE_KEYS = {
      ignoredAsins: "woodenRobot.ignoredAsins.v1",
      hiddenAsins: "woodenRobot.hiddenAsins.v1",
      selectedTag: "woodenRobot.selectedTag.v1"
    };

    const state = {
      deals: [],
      search: "",
      selectedTag: localStorage.getItem(STORAGE_KEYS.selectedTag) || "All",
      ignoredAsins: loadSet(STORAGE_KEYS.ignoredAsins),
      hiddenAsins: loadSet(STORAGE_KEYS.hiddenAsins)
    };

    const els = {
      searchInput: document.getElementById("searchInput"),
      clearSearchBtn: document.getElementById("clearSearchBtn"),
      tagFilters: document.getElementById("tagFilters"),
      dealGrid: document.getElementById("dealGrid"),
      emptyState: document.getElementById("emptyState"),
      dealCount: document.getElementById("dealCount"),
      activeFilterLabel: document.getElementById("activeFilterLabel"),
      showIgnoredBtn: document.getElementById("showIgnoredBtn"),
      toast: document.getElementById("toast")
    };

    init();

    async function init() {
      bindEvents();
      state.deals = normalizeDeals(await getDeals());
      render();
    }

    function bindEvents() {
      els.searchInput.addEventListener("input", event => {
        state.search = event.target.value.trim().toLowerCase();
        els.clearSearchBtn.style.display = state.search ? "block" : "none";
        renderDeals();
      });

      els.searchInput.addEventListener("keydown", event => {
        if (event.key === "Escape") clearSearch();
      });

      els.clearSearchBtn.addEventListener("click", clearSearch);

      els.showIgnoredBtn.addEventListener("click", () => {
        const ignored = [...state.ignoredAsins];
        if (!ignored.length) {
          showToast("No ignored ASINs yet.");
          return;
        }

        const restore = confirm(
          `Ignored ASINs:\n\n${ignored.join("\n")}\n\nRestore all ignored ASINs?`
        );

        if (restore) {
          state.ignoredAsins.clear();
          saveSet(STORAGE_KEYS.ignoredAsins, state.ignoredAsins);
          showToast("Ignored ASIN list cleared.");
          render();
        }
      });
    }

    async function getDeals() {
      if (Array.isArray(window.DEALS)) return window.DEALS;

      try {
        const response = await fetch("./data/deals.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`Failed to fetch deals: ${response.status}`);
        const data = await response.json();

        if (Array.isArray(data)) return data;
        if (Array.isArray(data.deals)) return data.deals;
        return [];
      } catch (error) {
        console.error(error);
        showToast("Could not load deals.json");
        return [];
      }
    }

    function normalizeDeals(deals) {
      return deals
        .filter(Boolean)
        .map(deal => {
          const asin = String(deal.asin || deal.ASIN || "").trim();
          const tags = normalizeTags(deal.tags || deal.tag || deal.categories || deal.category || []);

          return {
            ...deal,
            asin,
            title: deal.title || deal.name || "Untitled deal",
            price: deal.price ?? deal.currentPrice ?? deal.buyBoxPrice ?? null,
            image: deal.image || deal.imageUrl || deal.img || "",
            url: deal.url || deal.amazonUrl || deal.link || asinToAmazonUrl(asin),
            brand: deal.brand || "",
            tags
          };
        })
        .filter(deal => deal.asin);
    }

    function normalizeTags(value) {
      let tags;

      if (Array.isArray(value)) {
        tags = value;
      } else if (typeof value === "string") {
        tags = value.split(/[|,]/g);
      } else {
        tags = [];
      }

      return tags
        .map(tag => String(tag).trim())
        .filter(Boolean)
        .map(prettyTagName)
        .filter(uniqueOnly);
    }

    function prettyTagName(tag) {
      const normalized = tag.toLowerCase().replace(/[\s_-]+/g, " ").trim();

      const aliases = {
        "three d printing": "3D Printing",
        "3 d printing": "3D Printing",
        "3d printing": "3D Printing",
        "edc": "EDC",
        "diy": "DIY"
      };

      if (aliases[normalized]) return aliases[normalized];

      return normalized.replace(/\b\w/g, char => char.toUpperCase());
    }

    function uniqueOnly(value, index, array) {
      return array.indexOf(value) === index;
    }

    function render() {
      renderTagFilters();
      renderDeals();
    }

    function renderTagFilters() {
      const tags = getAllTags();

      if (!tags.includes(state.selectedTag)) {
        state.selectedTag = "All";
        localStorage.setItem(STORAGE_KEYS.selectedTag, state.selectedTag);
      }

      els.tagFilters.innerHTML = tags
        .map(tag => `
          <button
            type="button"
            class="tag-pill ${tag === state.selectedTag ? "active" : ""}"
            data-tag="${escapeHtml(tag)}"
          >${escapeHtml(tag)}</button>
        `)
        .join("");

      els.tagFilters.querySelectorAll(".tag-pill").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedTag = button.dataset.tag;
          localStorage.setItem(STORAGE_KEYS.selectedTag, state.selectedTag);
          render();
        });
      });
    }

    function getAllTags() {
      const tags = new Set(["All"]);

      state.deals.forEach(deal => {
        deal.tags.forEach(tag => tags.add(tag));
      });

      return [...tags].sort((a, b) => {
        if (a === "All") return -1;
        if (b === "All") return 1;
        return a.localeCompare(b);
      });
    }

    function renderDeals() {
      const visibleDeals = getVisibleDeals();

      els.dealCount.textContent = `${visibleDeals.length} ${visibleDeals.length === 1 ? "deal" : "deals"}`;
      els.activeFilterLabel.textContent = state.selectedTag === "All"
        ? "Showing all tags"
        : `Filtering by ${state.selectedTag}`;

      els.emptyState.style.display = visibleDeals.length ? "none" : "block";
      els.dealGrid.innerHTML = visibleDeals.map(renderDealCard).join("");

      bindCardButtons();
    }

    function getVisibleDeals() {
      return state.deals.filter(deal => {
        if (state.ignoredAsins.has(deal.asin)) return false;
        if (state.hiddenAsins.has(deal.asin)) return false;

        const matchesTag = state.selectedTag === "All" || deal.tags.includes(state.selectedTag);
        if (!matchesTag) return false;

        if (!state.search) return true;

        const haystack = [
          deal.title,
          deal.asin,
          deal.brand,
          ...(deal.tags || [])
        ].join(" ").toLowerCase();

        return haystack.includes(state.search);
      });
    }

    function renderDealCard(deal) {
      const price = formatPrice(deal.price);
      const img = deal.image
        ? `<img src="${escapeHtml(deal.image)}" alt="${escapeHtml(deal.title)}" loading="lazy" />`
        : `<span style="color:#111;">No image</span>`;

      return `
        <article class="deal-card" data-asin="${escapeHtml(deal.asin)}">
          <div class="image-wrap">${img}</div>
          <div class="card-body">
            <h2 class="title">${escapeHtml(deal.title)}</h2>
            <div class="meta-row">
              <div class="price">${price}</div>
              <div class="asin">${escapeHtml(deal.asin)}</div>
            </div>
            <div class="tags">
              ${(deal.tags || []).map(tag => `<span class="mini-tag">${escapeHtml(tag)}</span>`).join("")}
            </div>
            <div class="actions">
              <a class="buy-btn" href="${escapeHtml(deal.url)}" target="_blank" rel="noopener noreferrer">Amazon</a>
              <button class="hide-btn" type="button" data-action="hide" data-asin="${escapeHtml(deal.asin)}">Hide</button>
              <button class="junk-btn" type="button" data-action="junk" data-asin="${escapeHtml(deal.asin)}">Junk Deal — Ignore ASIN</button>
            </div>
          </div>
        </article>
      `;
    }

    function bindCardButtons() {
      els.dealGrid.querySelectorAll("[data-action='hide']").forEach(button => {
        button.addEventListener("click", () => {
          const asin = button.dataset.asin;
          state.hiddenAsins.add(asin);
          saveSet(STORAGE_KEYS.hiddenAsins, state.hiddenAsins);
          showToast(`Hidden ${asin} for this browser.`);
          renderDeals();
        });
      });

      els.dealGrid.querySelectorAll("[data-action='junk']").forEach(button => {
        button.addEventListener("click", () => {
          const asin = button.dataset.asin;
          const confirmed = confirm(
            `Mark ${asin} as a junk deal?\n\nThis will hide it and add it to the ignored ASIN list for this browser.`
          );

          if (!confirmed) return;

          state.ignoredAsins.add(asin);
          state.hiddenAsins.delete(asin);
          saveSet(STORAGE_KEYS.ignoredAsins, state.ignoredAsins);
          saveSet(STORAGE_KEYS.hiddenAsins, state.hiddenAsins);
          showToast(`${asin} added to ignored ASINs.`);
          render();
        });
      });
    }

    function clearSearch() {
      state.search = "";
      els.searchInput.value = "";
      els.clearSearchBtn.style.display = "none";
      els.searchInput.focus();
      renderDeals();
    }

    function loadSet(key) {
      try {
        return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
      } catch {
        return new Set();
      }
    }

    function saveSet(key, set) {
      localStorage.setItem(key, JSON.stringify([...set]));
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === "") return "See deal";

      const numeric = Number(value);
      if (Number.isNaN(numeric)) return String(value);

      return numeric.toLocaleString("en-US", {
        style: "currency",
        currency: "USD"
      });
    }

    function asinToAmazonUrl(asin) {
      return asin ? `https://www.amazon.com/dp/${encodeURIComponent(asin)}` : "#";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    let toastTimeout;
    function showToast(message) {
      clearTimeout(toastTimeout);
      els.toast.textContent = message;
      els.toast.style.display = "block";
      toastTimeout = setTimeout(() => {
        els.toast.style.display = "none";
      }, 2600);
    }
  </script></body>
</html>
