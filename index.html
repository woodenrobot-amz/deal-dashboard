<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WR Deal Command</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .loader-container { display: flex; gap: 10px; }
        .dot { width: 12px; height: 12px; background-color: #3b82f6; border-radius: 50%; animation: pulse 1.2s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; background-color: #60a5fa; }
        .dot:nth-child(3) { animation-delay: 0.4s; background-color: #93c5fd; }
        @keyframes pulse { 0%, 100% { transform: scale(0.5); opacity: 0.3; } 50% { transform: scale(1.2); opacity: 1; } }
        .deal-card { transition: all 0.2s ease-in-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .hot-glow { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); border-color: #f87171 !important; }
        .bg-keepa { background-color: #0099cc; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

    <div id="loading-screen" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader-container mb-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <h2 class="text-white font-black italic text-xl tracking-tighter uppercase">WR Command</h2>
    </div>

    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-4 border-blue-600 px-4 py-4">
        <div class="max-w-[1800px] mx-auto flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 px-2 py-1 rounded-lg font-black italic text-xl">WR</div>
                    <h1 class="text-lg font-black uppercase italic tracking-tighter">Deal Command</h1>
                </div>
                <div class="flex items-center gap-2">
                    <button id="clear-saved" onclick="clearAllSaved()" class="hidden bg-red-600 hover:bg-red-700 text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase transition-all">Clear All</button>
                    <p id="deal-count" class="text-sm font-black text-blue-300 uppercase bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">...</p>
                </div>
            </div>
            <div id="source-tabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar -mx-4 px-4"></div>
            <div class="flex gap-2">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." class="flex-grow bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2 text-white outline-none focus:border-blue-500">
                <select id="tagFilter" onchange="filterAndSort()" class="bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-yellow-500 outline-none font-bold text-sm">
                    <option value="All">All</option>
                    <option value="Brand">★ Brands</option>
                    <option value="Flash">⚡ Flash</option>
                    <option value="Hot">🔥 Hot</option>
                </select>
            </div>
            <div class="flex gap-2">
                <select id="sortSelect" onchange="filterAndSort()" class="flex-1 bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 font-bold text-white outline-none text-xs">
                    <option value="score">Score</option>
                    <option value="priceLow">Price: L to H</option>
                    <option value="priceHigh">Price: H to L</option>
                    <option value="rank">BSR</option>
                </select>
                <select id="subCatSelect" onchange="filterAndSort()" class="flex-1 max-w-[150px] bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-white outline-none text-xs truncate">
                    <option value="All">All Categories</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="max-w-[1800px] mx-auto px-4 mt-6">
        <div id="deal-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
    </main>

    <script>
        let allDeals = [], nameBrands = [], currentSourceKey = Object.keys(CONFIG.SOURCES)[0];
        const forceNum = (val) => parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;
        const cleanStr = (val) => String(val || "").replace(/["]/g, '').trim();

        // --- BOOKMARK LOGIC ---
        function toggleBookmark(asin) {
            let saved = JSON.parse(localStorage.getItem('mySavedDeals')) || [];
            if (saved.includes(asin)) {
                saved = saved.filter(id => id !== asin);
            } else {
                saved.push(asin);
            }
            localStorage.setItem('mySavedDeals', JSON.stringify(saved));
            filterAndSort();
        }

        function clearAllSaved() {
            if(confirm("Clear all bookmarked deals?")) {
                localStorage.setItem('mySavedDeals', JSON.stringify([]));
                filterAndSort();
            }
        }

        function copyText(text, btn, original) {
            navigator.clipboard.writeText(text).then(() => {
                const old = btn.innerText;
                btn.innerText = "COPIED!";
                setTimeout(() => btn.innerText = old, 1000);
            });
        }

        async function init() {
            const container = document.getElementById('source-tabs');
            // Added "SAVED" to the tabs list
            const sources = {...CONFIG.SOURCES, 'SAVED': {name: '⭐ Saved'}};
            container.innerHTML = Object.keys(sources).map(key => `<button onclick="switchSource('${key}')" class="whitespace-nowrap px-4 py-2 rounded-xl text-[10px] font-black uppercase ${currentSourceKey === key ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}">${sources[key].name}</button>`).join('');
            
            // Show/Hide Clear button
            document.getElementById('clear-saved').classList.toggle('hidden', currentSourceKey !== 'SAVED');

            try {
                const br = await fetch(`${CONFIG.BRAND_LIST_URL}&cb=${Date.now()}`);
                const bd = await br.text();
                nameBrands = bd.split(/\r?\n/).map(b => b.trim()).filter(b => b !== "");
                
                // If current source is SAVED, we need to pull data from the first source or a master list
                // For now, we fetch from the primary source defined in your config
                const fetchUrl = currentSourceKey === 'SAVED' ? CONFIG.SOURCES[Object.keys(CONFIG.SOURCES)[0]].url : CONFIG.SOURCES[currentSourceKey].url;
                
                const res = await fetch("data/deals.json?v=" + Date.now());
const json = await res.json();

allDeals = json.deals || [];
                allDeals = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length < 13) return null;
                    const d = { img: cleanStr(cols[0]), title: cleanStr(cols[1]), price: forceNum(cols[2]), avg90: forceNum(cols[3]), drop1Day: forceNum(cols[4]), isLowAll: String(cols[6]).toUpperCase().includes('YES'), category: cleanStr(cols[8]), rank: forceNum(cols[10]), url: cleanStr(cols[11]), keepa: cleanStr(cols[12]), rating: forceNum(cols[13]), asin: cleanStr(cols[14]), isNameBrand: nameBrands.some(b => cleanStr(cols[1]).toLowerCase().includes(b.toLowerCase())), isHot: forceNum(cols[10]) > 0 && forceNum(cols[10]) <= 5000 };
                    d.dealScore = Math.floor((d.rating * 5) + (d.avg90 > d.price ? ((d.avg90 - d.price) / d.avg90) * 100 * 1.5 : 0) + (d.drop1Day >= 5 ? 20 : 0) + (d.isHot ? 30 : 0) + (d.isLowAll ? 15 : 0) + (d.isNameBrand ? 15 : 0));
                    return d;
                }).filter(d => d && d.price > 0);

                // --- FIX: POPULATE CATEGORY DROPDOWN ---
                const cats = [...new Set(allDeals.map(d => d.category))].sort();
                const catSelect = document.getElementById('subCatSelect');
                catSelect.innerHTML = '<option value="All">All Categories</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');

                filterAndSort();
                setTimeout(() => { document.getElementById('loading-screen').style.opacity = '0'; setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500); }, 800);
            } catch (err) { console.error(err); document.getElementById('loading-screen').style.display = 'none'; }
        }

        function filterAndSort() {
            const s = document.getElementById('searchBox').value.toLowerCase(), sort = document.getElementById('sortSelect').value, sub = document.getElementById('subCatSelect').value, tag = document.getElementById('tagFilter').value;
            const saved = JSON.parse(localStorage.getItem('mySavedDeals')) || [];
            
            let f = allDeals.filter(d => {
                const matchesSaved = (currentSourceKey === 'SAVED') ? saved.includes(d.asin) : true;
                const matchesSearch = d.title.toLowerCase().includes(s);
                const matchesCat = (sub === "All" || d.category === sub);
                const matchesTag = (tag === "All" || (tag === "Flash" && d.drop1Day >= 5) || (tag === "Year" && d.isLowAll) || (tag === "Hot" && d.isHot) || (tag === "Brand" && d.isNameBrand));
                return matchesSaved && matchesSearch && matchesCat && matchesTag;
            });

            f.sort((a,b) => sort === "score" ? b.dealScore - a.dealScore : sort === "priceLow" ? a.price - b.price : sort === "priceHigh" ? b.price - a.price : (a.rank || 999999) - (b.rank || 999999));
            
            document.getElementById('deal-count').innerText = `${f.length} ITEMS`;
            document.getElementById('deal-grid').innerHTML = f.map(d => `<div class="deal-card bg-white rounded-[2rem] border-2 border-slate-200 p-5 flex flex-col relative ${d.isHot ? 'hot-glow' : ''}">
                <button onclick="toggleBookmark('${d.asin}')" class="absolute top-4 right-4 z-20 text-2xl drop-shadow-sm active:scale-125 transition-transform">${saved.includes(d.asin) ? '★' : '☆'}</button>
                <div class="flex flex-wrap gap-1 mb-3">${d.isNameBrand ? '<span class="bg-slate-900 text-white text-[9px] font-black px-2 py-1 rounded-lg">★ BRAND</span>' : ''}${d.isHot ? '<span class="bg-orange-500 text-white text-[9px] font-black px-2 py-1 rounded-lg">🔥 HOT</span>' : ''}${d.drop1Day >= 5 ? '<span class="bg-yellow-400 text-yellow-900 text-[9px] font-black px-2 py-1 rounded-lg">⚡ FLASH</span>' : ''}</div>
                <div class="h-40 flex items-center justify-center mb-4 bg-slate-50 rounded-2xl p-4 relative"><img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply"><a href="${d.keepa}" target="_blank" class="absolute bottom-2 right-2 bg-keepa text-white text-[9px] font-black px-3 py-1 rounded-lg">KEEPA ↗</a></div>
                <h3 class="font-bold text-lg h-20 overflow-hidden mb-4">${d.title}</h3>
                <div class="mb-5 bg-slate-50 p-4 rounded-2xl"><div class="flex justify-between items-center mb-2"><div><p class="text-[9px] text-slate-400 font-black">PRICE</p><p class="text-xl font-black">$${d.price.toFixed(2)}</p></div><div class="text-right"><p class="text-[9px] text-slate-400 font-black">90d AVG</p><p class="text-sm line-through text-slate-300">$${d.avg90.toFixed(2)}</p></div></div><div class="border-t pt-2 flex justify-between"><span class="text-[9px] font-black">SCORE</span><span class="text-xl font-black text-orange-600">${d.dealScore}</span></div></div>
                <div class="space-y-2 mt-auto"><a href="https://www.amazon.com/dp/${d.asin}/?tag=${CONFIG.AFFILIATE_TAG}" target="_blank" class="block text-center bg-orange-600 text-white text-[10px] font-black py-3 rounded-xl uppercase">VIEW ON AMAZON</a><button onclick="copyText('https://www.amazon.com/dp/${d.asin}/?tag=${CONFIG.AFFILIATE_TAG}', this, 'COPY LINK')" class="w-full bg-slate-900 text-white text-[10px] font-black py-2 rounded-xl uppercase">COPY LINK</button><button onclick="copyText('${d.asin}', this, 'ASIN: ${d.asin}')" class="w-full bg-blue-600 text-white text-[9px] font-black py-2 rounded-xl uppercase">COPY ASIN</button></div>
            </div>`).join('');
        }

        function switchSource(k) { currentSourceKey = k; localStorage.setItem('lastUsedSource', k); document.getElementById('searchBox').value = ""; document.getElementById('tagFilter').value = "All"; document.getElementById('subCatSelect').value = "All"; init(); }
        window.addEventListener('DOMContentLoaded', () => { const s = localStorage.getItem('lastUsedSource'); if (s && (CONFIG.SOURCES[s] || s === 'SAVED')) currentSourceKey = s; init(); });
    </script>
</body>
</html>
