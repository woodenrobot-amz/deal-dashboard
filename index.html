<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wooden Robot Deals</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --text: #f2f4f8;
      --muted: #9aa4b2;
      --border: #2b3240;
      --accent: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --good: #22c55e;
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 17, 21, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 14px 10px;
    }

    .top-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .deal-count {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    #searchInput {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      outline: none;
      font-size: 1rem;
    }

    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
    }

    #clearSearchBtn {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      line-height: 1;
    }

    #clearSearchBtn:hover {
      color: var(--text);
      background: #2a3140;
    }

    .filter-section {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-section::-webkit-scrollbar { display: none; }

    .tag-pill {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.88rem;
    }

    .tag-pill.active {
      background: var(--accent);
      color: #16100a;
      border-color: var(--accent);
      font-weight: 700;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 14px 90px;
    }

    .toolbar {
      position: sticky;
      top: 132px;
      z-index: 12;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin: -4px 0 12px;
      padding: 8px 0;
      background: rgba(15, 17, 21, 0.96);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font-size: 0.86rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar button {
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--panel);
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar button:hover { color: var(--text); }

    .toolbar button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #16100a;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .deal-card {
      position: relative;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card-menu-button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(43, 50, 64, 0.6);
      border-radius: 999px;
      background: rgba(23, 26, 33, 0.88);
      color: var(--text);
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .card-menu-button:hover {
      background: var(--panel-2);
      border-color: var(--accent);
    }

    .card-menu-button.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.7);
      color: #fbbf24;
    }

    .image-wrap {
      aspect-ratio: 4 / 3;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      max-height: 205px;
      overflow: hidden;
    }

    .image-wrap img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      margin: auto;
    }

    .card-body { padding: 12px; }

    .title {
      margin: 0 0 8px;
      font-size: 0.96rem;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.6em;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .price-stack {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .price {
      color: var(--good);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .avg-price {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 8px;
      margin-top: 4px;
      white-space: nowrap;
    }

    .score-post {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.55);
      color: #86efac;
    }

    .score-strong {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.55);
      color: #fbbf24;
    }

    .score-maybe {
      background: rgba(148, 163, 184, 0.14);
      border-color: rgba(148, 163, 184, 0.35);
      color: #cbd5e1;
    }

    .score-weak {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fecaca;
    }

    .asin {
      color: var(--muted);
      font-size: 0.75rem;
      text-align: right;
      word-break: break-all;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 9px 0 12px;
    }

    .mini-tag {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.74rem;
    }

    .mini-tag-spc {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.62);
      color: #fbbf24;
      font-weight: 800;
    }

    .deal-details {
      display: none;
      margin: 0 12px 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(31, 36, 48, 0.72);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .deal-card.details-open .deal-details {
      display: block;
    }

    .details-title {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .detail-row,
    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .detail-row span:first-child,
    .score-row span:first-child {
      color: var(--muted);
    }

    .detail-row span:last-child,
    .score-row span:last-child {
      color: var(--text);
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .score-breakdown {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 8px;
    }

    .score-breakdown-title {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .score-row {
      padding: 3px 0;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .actions a,
    .actions button {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 9px 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.84rem;
      line-height: 1.15;
    }

    .buy-btn {
      color: #17110a;
      background: var(--accent);
      border-color: var(--accent) !important;
    }

    .copy-btn,
    .bookmark-btn,
    .hide-btn {
      background: var(--panel-2);
      color: var(--text);
    }

    .bookmark-btn.active {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.65) !important;
      color: #fbbf24;
    }

    .junk-btn {
      grid-column: 1 / -1;
      background: var(--danger-bg);
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.35) !important;
    }

    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      padding: 32px 18px;
      text-align: center;
      background: rgba(255,255,255,0.02);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #111827;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
      z-index: 40;
      display: none;
      max-width: calc(100% - 28px);
      text-align: center;
      font-size: 0.9rem;
    }

    @media (min-width: 760px) {
      header { padding: 16px 22px 12px; }
      main { padding: 20px 22px 100px; }
      h1 { font-size: 1.35rem; }
      .toolbar { top: 142px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <h1>Wooden Robot Deals</h1>
      <div class="deal-count" id="dealCount">0 deals</div>
    </div>

    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search deals, brands, ASINs..." autocomplete="off">
      <button id="clearSearchBtn" type="button" aria-label="Clear search">×</button>
    </div>

    <div class="filter-section" id="tagFilters" aria-label="Filter by tag"></div>
  </header>

  <main>
    <div class="toolbar">
      <span id="activeFilterLabel">Showing all tags</span>
      <div class="toolbar-actions">
        <button id="showBookmarksBtn" type="button">Bookmarks</button>
        <button id="copyIgnoredBtn" type="button">Copy Ignored</button>
        <button id="showIgnoredBtn" type="button">Ignored ASINs</button>
      </div>
    </div>

    <section id="dealGrid" class="grid"></section>
    <section id="emptyState" class="empty-state" style="display:none;">No matching deals found.</section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEYS = {
      ignoredAsins: "woodenRobot.ignoredAsins.v1",
      hiddenAsins: "woodenRobot.hiddenAsins.v1",
      bookmarkedAsins: "woodenRobot.bookmarkedAsins.v1",
      selectedTag: "woodenRobot.selectedTag.v1"
    };

    const state = {
      deals: [],
      search: "",
      selectedTag: localStorage.getItem(STORAGE_KEYS.selectedTag) || "All",
      showBookmarksOnly: false,
      ignoredAsins: loadSet(STORAGE_KEYS.ignoredAsins),
      hiddenAsins: loadSet(STORAGE_KEYS.hiddenAsins),
      bookmarkedAsins: loadSet(STORAGE_KEYS.bookmarkedAsins)
    };

    const els = {
      searchInput: document.getElementById("searchInput"),
      clearSearchBtn: document.getElementById("clearSearchBtn"),
      tagFilters: document.getElementById("tagFilters"),
      dealGrid: document.getElementById("dealGrid"),
      emptyState: document.getElementById("emptyState"),
      dealCount: document.getElementById("dealCount"),
      activeFilterLabel: document.getElementById("activeFilterLabel"),
      showBookmarksBtn: document.getElementById("showBookmarksBtn"),
      copyIgnoredBtn: document.getElementById("copyIgnoredBtn"),
      showIgnoredBtn: document.getElementById("showIgnoredBtn"),
      toast: document.getElementById("toast")
    };

    init();

    async function init() {
      bindEvents();
      state.deals = normalizeDeals(await getDeals());
      render();
    }

    function bindEvents() {
      els.searchInput.addEventListener("input", function(event) {
        state.search = event.target.value.trim().toLowerCase();
        els.clearSearchBtn.style.display = state.search ? "block" : "none";
        renderDeals();
      });

      els.searchInput.addEventListener("keydown", function(event) {
        if (event.key === "Escape") clearSearch();
      });

      els.clearSearchBtn.addEventListener("click", clearSearch);

      els.showBookmarksBtn.addEventListener("click", function() {
        state.showBookmarksOnly = !state.showBookmarksOnly;
        renderDeals();
      });

      els.copyIgnoredBtn.addEventListener("click", async function() {
        const ignored = Array.from(state.ignoredAsins).sort();
        if (!ignored.length) {
          showToast("No ignored ASINs to copy.");
          return;
        }

        const output = JSON.stringify(ignored, null, 2);
        await copyToClipboard(output);
        showToast("Copied ignored ASIN list as JSON.");
      });

      els.showIgnoredBtn.addEventListener("click", function() {
        const ignored = Array.from(state.ignoredAsins).sort();
        if (!ignored.length) {
          showToast("No ignored ASINs yet.");
          return;
        }

        const message = ["Ignored ASINs:", "", ignored.join(String.fromCharCode(10)), "", "Tip: use Copy Ignored to paste this list into ChatGPT for search tuning.", "", "Restore all ignored ASINs?"].join(String.fromCharCode(10));
        const restore = confirm(message);

        if (restore) {
          state.ignoredAsins.clear();
          saveSet(STORAGE_KEYS.ignoredAsins, state.ignoredAsins);
          showToast("Ignored ASIN list cleared.");
          render();
        }
      });
    }

    async function getDeals() {
      if (Array.isArray(window.DEALS)) return window.DEALS;

      try {
        const response = await fetch("./data/deals.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Failed to fetch deals");
        const data = await response.json();
        if (Array.isArray(data)) return data;
        if (Array.isArray(data.deals)) return data.deals;
        return [];
      } catch (error) {
        console.error(error);
        showToast("Could not load deals.json");
        return [];
      }
    }

    function normalizeDeals(deals) {
      return deals.filter(Boolean).map(function(deal) {
        const asin = String(deal.asin || deal.ASIN || "").trim();
        const sources = normalizeSources(deal.sources || deal.source || []);
        const spcImported = Boolean(
          deal.spcImported ||
          deal.inSponsoredProductsPool ||
          deal.sponsoredProductsCreator ||
          sources.includes("sponsored_products_creators")
        );
        const tags = normalizeTags(
          []
            .concat(
              deal.tags ||
              deal.tag ||
              deal.categories ||
              deal.category ||
              deal.stream ||
              deal.dealStream ||
              []
            )
            .concat(spcImported ? ["SPC Op"] : [])
        );
        const price = firstValidNumber(deal.price, deal.currentPrice, deal.buyBoxPrice, deal.salePrice, deal.dealPrice);
        const avg90 = getAvg90(deal);

        return Object.assign({}, deal, {
          asin: asin,
          title: deal.title || deal.name || "Untitled deal",
          price: price,
          avg90: avg90,
          image: deal.image || deal.imageUrl || deal.img || "",
          url: deal.url || deal.amazonUrl || deal.link || asinToAmazonUrl(asin),
          brand: deal.brand || "",
          sources: sources,
          spcImported: spcImported,
          spcCapturedAt: deal.spcCapturedAt || deal.capturedAt || "",
          tags: tags,
          score: firstValidNumber(deal.score, deal.dealScore, deal.powerScore),
          scoreBreakdown: deal.scoreBreakdown || {},
          parentAsin: String(deal.parentAsin || "").trim(),
          familyKey: String(deal.familyKey || deal.parentAsin || asin).trim(),
          variationCount: firstValidNumber(deal.variationCount, deal.variations, deal.variationTotal),
          productAgeDays: firstValidNumber(deal.productAgeDays, deal.trackingDays, deal.daysTracked, deal.keepaTrackingDays),
          reviewCount: firstValidNumber(deal.reviewCount, deal.reviews, deal.ratingCount),
          salesRank: firstValidNumber(deal.salesRank, deal.currentSalesRank, deal.rank),
          trackingDays: firstValidNumber(deal.trackingDays, deal.daysTracked, deal.keepaTrackingDays, deal.productAgeDays)
        });
      }).filter(function(deal) {
        return deal.asin;
      }).map(function(deal) {
        if (deal.score === null) deal.score = scoreDeal(deal);
        return deal;
      });
    }

    function getAvg90(deal) {
      const candidates = [
        deal.avg90,
        deal.average90,
        deal.avg90Price,
        deal.avg90DayPrice,
        deal.ninetyDayAverage,
        deal.ninetyDayAvg
      ];

      if (deal.stats) {
        candidates.push(deal.stats.avg90);
        if (deal.stats.current) candidates.push(deal.stats.current.avg90);
      }

      if (deal.keepa) {
        candidates.push(deal.keepa.avg90);
        if (deal.keepa.stats) candidates.push(deal.keepa.stats.avg90);
      }

      return firstValidNumber.apply(null, candidates);
    }

    function normalizeSources(value) {
      if (Array.isArray(value)) {
        return value.map(function(source) {
          return String(source || "").trim();
        }).filter(Boolean);
      }

      if (typeof value === "string") {
        return value
          .replaceAll("|", ",")
          .split(",")
          .map(function(source) {
            return source.trim();
          })
          .filter(Boolean);
      }

      return [];
    }

    function normalizeTags(value) {
      let tags = [];
      if (Array.isArray(value)) {
        tags = value;
      } else if (typeof value === "string") {
        tags = value.replaceAll("|", ",").split(",");
      }

      const seen = new Set();
      return tags.map(function(tag) {
        return prettyTagName(String(tag).trim());
      }).filter(function(tag) {
        if (!tag) return false;
        if (seen.has(tag)) return false;
        seen.add(tag);
        return true;
      });
    }

    function prettyTagName(tag) {
      const normalized = tag.toLowerCase().replaceAll("_", " ").replaceAll("-", " ").trim();
      const compacted = normalized.split(" ").filter(Boolean).join(" ");

      const aliases = {
        "three d printing": "3D Printing",
"three d printer": "3D Printing",
"3 d printing": "3D Printing",
"3d printing": "3D Printing",
"3d printer": "3D Printing",
"3d printers": "3D Printing",
"additive manufacturing": "3D Printing",
        "edc": "EDC",
        "diy": "DIY",
        "spc op": "SPC Op",
        "sponsored products creators": "SPC Op",
        "sponsored products creator": "SPC Op",
        "sponsored products for creators": "SPC Op",
        "sponsored products creators pool": "SPC Op"
      };

      if (aliases[compacted]) return aliases[compacted];

      return compacted.split(" ").map(function(word) {
        if (!word) return "";
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(" ");
    }

    function render() {
      renderTagFilters();
      renderDeals();
    }

    function renderTagFilters() {
      const tags = getAllTags();

      if (!tags.includes(state.selectedTag)) {
        state.selectedTag = "All";
        localStorage.setItem(STORAGE_KEYS.selectedTag, state.selectedTag);
      }

      els.tagFilters.innerHTML = tags.map(function(tag) {
        const active = tag === state.selectedTag ? "active" : "";
        return '<button type="button" class="tag-pill ' + active + '" data-tag="' + escapeHtml(tag) + '">' + escapeHtml(tag) + '</button>';
      }).join("");

      Array.from(els.tagFilters.querySelectorAll(".tag-pill")).forEach(function(button) {
        button.addEventListener("click", function() {
          state.selectedTag = button.dataset.tag;
          localStorage.setItem(STORAGE_KEYS.selectedTag, state.selectedTag);
          render();
        });
      });
    }

    function getAllTags() {
      const tags = new Set(["All"]);
      state.deals.forEach(function(deal) {
        deal.tags.forEach(function(tag) {
          tags.add(tag);
        });
      });

      return Array.from(tags).sort(function(a, b) {
        if (a === "All") return -1;
        if (b === "All") return 1;
        return a.localeCompare(b);
      });
    }

    function renderDeals() {
      const visibleDeals = getVisibleDeals();
      els.dealCount.textContent = visibleDeals.length + " " + (visibleDeals.length === 1 ? "deal" : "deals");
      els.showBookmarksBtn.classList.toggle("active", state.showBookmarksOnly);

      const filterText = state.selectedTag === "All" ? "Showing all tags" : "Filtered by " + state.selectedTag;
      els.activeFilterLabel.textContent = state.showBookmarksOnly ? filterText + " · Bookmarks only" : filterText;

      els.emptyState.style.display = visibleDeals.length ? "none" : "block";
      els.dealGrid.innerHTML = visibleDeals.map(renderDealCard).join("");
      bindCardButtons();
    }

    function getVisibleDeals() {
      return state.deals.filter(function(deal) {
        if (state.ignoredAsins.has(deal.asin)) return false;
        if (state.hiddenAsins.has(deal.asin)) return false;
        if (state.showBookmarksOnly && !state.bookmarkedAsins.has(deal.asin)) return false;

        const matchesTag = state.selectedTag === "All" || deal.tags.includes(state.selectedTag);
        if (!matchesTag) return false;

        if (!state.search) return true;

        const haystack = [deal.title, deal.asin, deal.brand, deal.spcImported ? "SPC Op" : ""]
          .concat(deal.tags || [])
          .concat(deal.sources || [])
          .join(" ")
          .toLowerCase();
        return haystack.includes(state.search);
      });
    }

    function renderDealCard(deal) {
      const price = formatPrice(deal.price);
      const avg90 = shouldShowAvg90(deal.price, deal.avg90)
        ? '<div class="avg-price" title="90-day average">90-day avg ' + formatPrice(deal.avg90) + '</div>'
        : "";
      const scoreBadge = renderScoreBadge(deal.score);
      const isBookmarked = state.bookmarkedAsins.has(deal.asin);
      const bookmarkLabel = isBookmarked ? "Bookmarked" : "Bookmark";
      const bookmarkClass = isBookmarked ? "bookmark-btn active" : "bookmark-btn";
      const img = deal.image
        ? '<img src="' + escapeHtml(deal.image) + '" alt="' + escapeHtml(deal.title) + '" loading="lazy">'
        : '<span style="color:#111;">No image</span>';
      const tags = (deal.tags || []).map(function(tag) {
        const tagClass = tag === "SPC Op" ? "mini-tag mini-tag-spc" : "mini-tag";
        return '<span class="' + tagClass + '">' + escapeHtml(tag) + '</span>';
      }).join("");

      return '<article class="deal-card" data-asin="' + escapeHtml(deal.asin) + '">' +
        '<button class="card-menu-button" type="button" data-action="details" data-asin="' + escapeHtml(deal.asin) + '" aria-label="Show deal details" title="Deal details">☰</button>' +
        '<div class="image-wrap">' + img + '</div>' +
        '<div class="card-body">' +
        '<h2 class="title">' + escapeHtml(deal.title) + '</h2>' +
        '<div class="meta-row">' +
        '<div class="price-stack"><div class="price">' + price + '</div>' + avg90 + scoreBadge + '</div>' +
        '<div class="asin">' + escapeHtml(deal.asin) + '</div>' +
        '</div>' +
        '<div class="tags">' + tags + '</div>' +
        '<div class="actions">' +
        '<a class="buy-btn" href="' + escapeHtml(deal.url) + '" target="_blank" rel="noopener noreferrer">Amazon</a>' +
        '<button class="copy-btn" type="button" data-action="copy" data-asin="' + escapeHtml(deal.asin) + '">Copy ASIN</button>' +
        '<button class="' + bookmarkClass + '" type="button" data-action="bookmark" data-asin="' + escapeHtml(deal.asin) + '">' + bookmarkLabel + '</button>' +
        '<button class="hide-btn" type="button" data-action="hide" data-asin="' + escapeHtml(deal.asin) + '">Hide</button>' +
        '<button class="junk-btn" type="button" data-action="junk" data-asin="' + escapeHtml(deal.asin) + '">Ignore ASIN</button>' +
        '</div>' +
        '</div>' +
        renderDealDetails(deal) +
        '</article>';
    }

    function renderDealDetails(deal) {
      const parentAsin = deal.parentAsin || "None";
      const familyKey = deal.familyKey || deal.parentAsin || deal.asin || "None";
      const productAge = deal.productAgeDays ? Math.round(Number(deal.productAgeDays)) + " days" : "Unknown";
      const variationCount = deal.variationCount ? Math.round(Number(deal.variationCount)) : 0;
      const reviewCount = deal.reviewCount ? Math.round(Number(deal.reviewCount)).toLocaleString("en-US") : "Unknown";
      const rank = deal.salesRank ? "#" + Math.round(Number(deal.salesRank)).toLocaleString("en-US") : "Unknown";
      const spcStatus = deal.spcImported ? "Yes" : "No";
      const sourceList = (deal.sources || []).length ? deal.sources.join(", ") : "Unknown";

      return '<div class="deal-details" id="details-' + escapeHtml(deal.asin) + '">' +
        '<div class="details-title">Deal Deep Dive</div>' +
        '<div class="details-grid">' +
        detailRow("Score", Number.isFinite(Number(deal.score)) ? Math.round(Number(deal.score)) : "Unknown") +
        detailRow("Product Age", productAge) +
        detailRow("Parent ASIN", parentAsin) +
        detailRow("Family Key", familyKey) +
        detailRow("Variations", variationCount) +
        detailRow("Reviews", reviewCount) +
        detailRow("Sales Rank", rank) +
        detailRow("SPC Op", spcStatus) +
        detailRow("Sources", sourceList) +
        '</div>' +
        renderScoreBreakdown(deal.scoreBreakdown) +
        '</div>';
    }

    function detailRow(label, value) {
      return '<div class="detail-row"><span>' + escapeHtml(label) + '</span><span>' + escapeHtml(value) + '</span></div>';
    }

    function renderScoreBreakdown(breakdown) {
      if (!breakdown || !Object.keys(breakdown).length) {
        return '<div class="score-breakdown"><div class="score-breakdown-title">Score Detail</div><div class="score-row"><span>No breakdown stored yet</span><span>—</span></div></div>';
      }

      const rows = Object.entries(breakdown).map(function(entry) {
        const key = prettyScoreKey(entry[0]);
        const value = Number(entry[1]);
        const displayValue = Number.isFinite(value) ? "+" + Math.round(value) : String(entry[1]);

        return '<div class="score-row"><span>' + escapeHtml(key) + '</span><span>' + escapeHtml(displayValue) + '</span></div>';
      }).join("");

      return '<div class="score-breakdown"><div class="score-breakdown-title">Score Detail</div>' + rows + '</div>';
    }

    function prettyScoreKey(key) {
      return String(key || "")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replaceAll("_", " ")
        .replaceAll("-", " ")
        .trim()
        .split(" ")
        .filter(Boolean)
        .map(function(word) {
          return word.charAt(0).toUpperCase() + word.slice(1);
        })
        .join(" ");
    }

    function bindCardButtons() {
      Array.from(els.dealGrid.querySelectorAll('[data-action="details"]')).forEach(function(button) {
        button.addEventListener("click", function() {
          const card = button.closest(".deal-card");
          if (!card) return;

          card.classList.toggle("details-open");
          button.classList.toggle("active", card.classList.contains("details-open"));
        });
      });

      Array.from(els.dealGrid.querySelectorAll('[data-action="copy"]')).forEach(function(button) {
        button.addEventListener("click", async function() {
          const asin = button.dataset.asin;
          await copyToClipboard(asin);
          showToast("Copied " + asin);
        });
      });

      Array.from(els.dealGrid.querySelectorAll('[data-action="bookmark"]')).forEach(function(button) {
        button.addEventListener("click", function() {
          const asin = button.dataset.asin;
          if (state.bookmarkedAsins.has(asin)) {
            state.bookmarkedAsins.delete(asin);
            showToast("Removed " + asin + " from bookmarks.");
          } else {
            state.bookmarkedAsins.add(asin);
            showToast("Bookmarked " + asin + ".");
          }
          saveSet(STORAGE_KEYS.bookmarkedAsins, state.bookmarkedAsins);
          renderDeals();
        });
      });

      Array.from(els.dealGrid.querySelectorAll('[data-action="hide"]')).forEach(function(button) {
        button.addEventListener("click", function() {
          const asin = button.dataset.asin;
          state.hiddenAsins.add(asin);
          saveSet(STORAGE_KEYS.hiddenAsins, state.hiddenAsins);
          showToast("Hidden " + asin + " for this browser.");
          renderDeals();
        });
      });

      Array.from(els.dealGrid.querySelectorAll('[data-action="junk"]')).forEach(function(button) {
        button.addEventListener("click", function() {
          const asin = button.dataset.asin;
          const confirmed = confirm("Mark " + asin + " as a junk deal? This will hide it and add it to the ignored ASIN list for this browser.");
          if (!confirmed) return;

          state.ignoredAsins.add(asin);
          state.hiddenAsins.delete(asin);
          state.bookmarkedAsins.delete(asin);
          saveSet(STORAGE_KEYS.ignoredAsins, state.ignoredAsins);
          saveSet(STORAGE_KEYS.hiddenAsins, state.hiddenAsins);
          saveSet(STORAGE_KEYS.bookmarkedAsins, state.bookmarkedAsins);
          showToast(asin + " added to ignored ASINs.");
          render();
        });
      });
    }

    function clearSearch() {
      state.search = "";
      els.searchInput.value = "";
      els.clearSearchBtn.style.display = "none";
      els.searchInput.focus();
      renderDeals();
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    function firstValidNumber() {
      for (let i = 0; i < arguments.length; i++) {
        const value = arguments[i];
        if (value === null || value === undefined || value === "") continue;

        if (Array.isArray(value)) {
          const found = firstValidNumber.apply(null, value);
          if (found !== null) return found;
          continue;
        }

        const numeric = Number(value);
        if (Number.isFinite(numeric) && numeric > 0) return numeric;
      }
      return null;
    }

    function shouldShowAvg90(price, avg90) {
      if (!Number.isFinite(Number(price)) || !Number.isFinite(Number(avg90))) return false;
      return Number(avg90) > Number(price);
    }

    function renderScoreBadge(score) {
      const numeric = Number(score);
      if (!Number.isFinite(numeric)) return "";

      let className = "score-badge score-weak";
      let label = "Weak";

      if (numeric >= 85) {
        className = "score-badge score-post";
        label = "Post";
      } else if (numeric >= 70) {
        className = "score-badge score-strong";
        label = "Strong";
      } else if (numeric >= 55) {
        className = "score-badge score-maybe";
        label = "Maybe";
      }

      return '<div class="' + className + '" title="Deal score">' + Math.round(numeric) + ' · ' + label + '</div>';
    }

    function scoreDeal(deal) {
      let score = 0;
      const price = Number(deal.price);
      const avg90 = Number(deal.avg90);
      const reviewCount = Number(deal.reviewCount || 0);
      const rank = Number(deal.salesRank || 0);
      const trackingDays = Number(deal.trackingDays || 0);
      const brand = String(deal.brand || "").toLowerCase().trim();
      const tags = (deal.tags || []).map(function(tag) { return String(tag).toLowerCase(); });

      if (price > 0 && avg90 > price) {
        const discountPct = ((avg90 - price) / avg90) * 100;
        score += Math.min(35, Math.round(discountPct * 1.15));
      }

      if (TIER_1_BRANDS.has(brand)) score += 20;
      else if (TIER_2_BRANDS.has(brand)) score += 12;
      else if (TIER_3_BRANDS.has(brand)) score += 6;

      if (trackingDays >= 365) score += 15;
      else if (trackingDays >= 180) score += 11;
      else if (trackingDays >= 90) score += 7;
      else if (trackingDays > 0) score += 2;

      if (reviewCount >= 1000) score += 10;
      else if (reviewCount >= 300) score += 8;
      else if (reviewCount >= 100) score += 5;
      else if (reviewCount >= 30) score += 2;

      if (rank > 0 && rank <= 5000) score += 5;
      else if (rank > 0 && rank <= 20000) score += 3;
      else if (rank > 0 && rank <= 75000) score += 1;

      if (tags.includes("woodworking")) score += 10;
      else if (tags.includes("3d printing")) score += 9;
      else if (tags.includes("edc")) score += 8;
      else if (tags.includes("grilling")) score += 7;
      else if (tags.includes("tools")) score += 6;

      if (deal.asin && deal.asin.startsWith("B0") && reviewCount > 0 && reviewCount < 75) score -= 12;
      if (trackingDays > 0 && trackingDays < 90) score -= 10;
      if (!brand) score -= 5;
      if (price > 0 && price < 8) score -= 5;

      return Math.max(0, Math.min(100, Math.round(score)));
    }

    const TIER_1_BRANDS = new Set([
      "dewalt", "milwaukee", "makita", "bosch", "festool", "sawstop", "bambu lab",
      "woodpeckers", "starrett", "knipex", "wera", "wiha", "leatherman", "yeti",
      "blackstone", "weber", "traeger", "solo stove"
    ]);

    const TIER_2_BRANDS = new Set([
      "ridgid", "ryobi", "diablo", "freud", "bessey", "kreg", "rockler", "titebond",
      "rubio monocoat", "prusa", "creality", "anycubic", "elegoo", "flashforge",
      "overture", "polymaker", "hatchbox", "esun", "rtic", "stanley", "gerber",
      "spyderco", "benchmade", "olight", "meater"
    ]);

    const TIER_3_BRANDS = new Set([
      "sunlu", "bigtreetech", "micro swiss", "noctua", "klingspor"
    ]);

    function loadSet(key) {
      try {
        return new Set(JSON.parse(localStorage.getItem(key) || "[]"));
      } catch (error) {
        return new Set();
      }
    }

    function saveSet(key, set) {
      localStorage.setItem(key, JSON.stringify(Array.from(set)));
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === "") return "See deal";
      const numeric = Number(value);
      if (Number.isNaN(numeric)) return String(value);
      return numeric.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }

    function asinToAmazonUrl(asin) {
      return asin ? "https://www.amazon.com/dp/" + encodeURIComponent(asin) : "#";
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll(String.fromCharCode(34), "&quot;")
        .replaceAll("'", "&#039;");
    }

    let toastTimeout;
    function showToast(message) {
      clearTimeout(toastTimeout);
      els.toast.textContent = message;
      els.toast.style.display = "block";
      toastTimeout = setTimeout(function() {
        els.toast.style.display = "none";
      }, 2600);
    }
  </script>
</body>
