    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1QglaKzDDE5441XFT9FAhJgp7lK75YqysOo1ctQbXI1-g46k10vPG9E5MoihGd4g9bsgBnuL2IoMu/pub?output=csv';
        const AFFILIATE_ID = "YOUR_AFFILIATE_ID";
        const POSTTAP_PREFIX = "https://ptap.it/yourhandle/"; 

        let allDeals = [];

        async function init() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1); 
                const hiddenDeals = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
                
                allDeals = rows.map(row => {
                    const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (!cols || cols.length < 11) return null;

                    const d = {
                        img: cols[0].replace(/"/g, ''),
                        title: cols[1].replace(/"/g, ''),
                        price: parseFloat(cols[2].replace(/[$,]/g, '')),
                        avg90: parseFloat(cols[3].replace(/[$,]/g, '')),
                        isLow90: cols[4].toUpperCase().includes('TRUE'),
                        isLowAll: cols[5].toUpperCase().includes('TRUE'),
                        rating: parseFloat(cols[6]),
                        reviews: cols[7],
                        category: cols[8].replace(/"/g, '').trim(),
                        lastChange: cols[9], // Expected as a date string or hours
                        rank: parseInt(cols[10].replace(/[,#]/g, '')),
                        url: cols[11].replace(/"/g, '')
                    };
                    
                    // CALCULATE SCORE
                    const savingsPct = ((d.avg90 - d.price) / d.avg90) * 100;
                    let score = savingsPct * 1.5; // Base discount weight

                    // Rank Boost (Tiered for Velocity)
                    if (d.rank <= 500) score += 35;
                    else if (d.rank <= 2000) score += 20;
                    else if (d.rank <= 10000) score += 10;

                    // Quality Boost
                    score += (d.rating * 5);

                    d.dealScore = Math.round(score);
                    return d;
                }).filter(d => d !== null && d.rating >= 4.2 && !hiddenDeals.includes(d.url));

                // SORT BY DEAL SCORE (Highest First)
                allDeals.sort((a, b) => b.dealScore - a.dealScore);

                renderDeals(allDeals);
            } catch (err) { console.error(err); }
        }

        function generateLink(url) {
            const fullUrl = url.includes('?') ? `${url}&tag=${AFFILIATE_ID}` : `${url}?tag=${AFFILIATE_ID}`;
            const deepLink = `${POSTTAP_PREFIX}${encodeURIComponent(fullUrl)}`;
            
            navigator.clipboard.writeText(deepLink);
            alert("Deep Link Copied to Clipboard!");
            window.open(deepLink, '_blank');
        }

        function hideCard(url) {
            let hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            hidden.push(url);
            localStorage.setItem('hiddenDeals', JSON.stringify(hidden));
            location.reload(); // Refresh to clear the card
        }

        function renderDeals(deals) {
            const grid = document.getElementById('deal-grid');
            grid.innerHTML = deals.map(d => `
                <div class="deal-card bg-white rounded-3xl border border-slate-200 overflow-hidden flex flex-col relative">
                    <button onclick="hideCard('${d.url}')" class="absolute top-2 right-2 z-30 bg-white/80 hover:bg-red-500 hover:text-white p-2 rounded-full text-xs transition-all">✕</button>
                    
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-orange-100 text-orange-700 text-[10px] font-black px-2 py-1 rounded">SCORE: ${d.dealScore}</span>
                            ${d.isLowAll ? '<span class="bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded">YEAR LOW</span>' : ''}
                        </div>
                        <img src="${d.img}" class="h-40 w-full object-contain mb-4">
                        <h3 class="font-bold text-sm h-10 overflow-hidden mb-2">${d.title}</h3>
                        <div class="flex justify-between items-end border-t pt-4">
                            <div>
                                <p class="text-[9px] text-slate-400 font-black uppercase">Now</p>
                                <p class="text-2xl font-black">$${d.price}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] text-slate-400 font-black uppercase">Rank</p>
                                <p class="text-xs font-bold">#${d.rank.toLocaleString()}</p>
                            </div>
                        </div>
                        <button onclick="generateLink('${d.url}')" class="mt-4 w-full bg-slate-900 text-white font-black py-3 rounded-xl hover:bg-blue-600 transition-all">POST TO GROUP</button>
                    </div>
                </div>
            `).join('');
        }
        init();
    </script>
