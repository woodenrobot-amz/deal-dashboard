<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wooden Robot | Command v1.5.3</title>
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .deal-card { transition: all 0.2s ease-in-out; }
        .deal-card:hover { transform: translateY(-4px); }
        /* Sticky Version Tracker */
        #version-tag { position: fixed; bottom: 10px; right: 10px; font-size: 10px; font-weight: 900; color: #94a3b8; z-index: 100; pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <div id="version-tag">COMMAND V1.5.3</div>

    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-2 border-blue-600 px-6 py-4">
        <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 px-3 py-1 rounded-lg font-black italic tracking-tighter text-2xl text-white">WR</div>
                <div>
                    <h1 class="text-lg font-black tracking-tighter uppercase italic leading-none text-white">Deal <span class="text-blue-500">Command</span></h1>
                    <p id="deal-count" class="text-[9px] font-bold text-blue-300 uppercase tracking-widest mt-1">INITIALIZING...</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white outline-none w-48">
                <select id="sortSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none font-bold">
                    <option value="score">Sort: Score</option>
                    <option value="drop">Sort: % Drop</option>
                    <option value="rank">Sort: BSR</option>
                </select>
                <select id="subCatSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none max-w-[150px]">
                    <option value="All">All Categories</option>
                </select>
                <button onclick="resetHidden()" class="bg-red-900/20 text-red-400 border border-red-800 px-3 py-2 rounded-lg text-[10px] font-bold">RESET</button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-6 mt-8">
        <div id="deal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
    </main>

    <script>
        let allDeals = [];

        const forceNum = (val) => {
            if (!val) return 0;
            const cleaned = String(val).replace(/[^0-9.-]/g, '');
            const parsed = parseFloat(cleaned);
            return isNaN(parsed) ? 0 : parsed;
        };

        const cleanUrl = (url) => {
            if (!url) return "";
            return url.replace(/["\s]/g, '').trim();
        };

        async function init() {
            const statusEl = document.getElementById('deal-count');
            try {
                const response = await fetch(`${CONFIG.CSV_URL}&cb=${Date.now()}`);
                if (!response.ok) throw new Error("Sheet Connection Failed");
                
                const csvData = await response.text();
                const lines = csvData.split(/\r?\n/).filter(line => line.trim() !== "");
                const rows = lines.slice(1);
                
                const hiddenDeals = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
                const subCats = new Set();

                allDeals = rows.map((row, idx) => {
                    try {
                        const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                        // If columns are missing, skip this row but keep going
                        if (!cols || cols.length < 13) return null;

                        const d = {
                            img: cleanUrl(cols[0]),
                            title: (cols[1] || "No Title").replace(/"/g, ''),
                            price: forceNum(cols[2]),
                            avg90: forceNum(cols[3]),
                            drop1Day: forceNum(cols[4]),
                            isLow90: String(cols[5]).toUpperCase().includes('YES'),
                            isLowAll: String(cols[6]).toUpperCase().includes('YES'),
                            reviews: forceNum(cols[7]),
                            subCategory: (cols[8] || "General").replace(/"/g, '').trim(),
                            rank: forceNum(cols[10]),
                            url: cleanUrl(cols[11]),
                            keepaUrl: cleanUrl(cols[12]),
                            rating: forceNum(cols[13])
                        };

                        // Math with Safety Checks
                        let s = 0;
                        if (d.avg90 > 0 && d.price > 0) {
                            let pct = ((d.avg90 - d.price) / d.avg90) * 100;
                            if (pct > 100) pct = 100; 
                            s += (pct * (forceNum(CONFIG.WEIGHT_SAVINGS) || 1.5));
                        }
                        s += (d.rating * (forceNum(CONFIG.WEIGHT_RATING) || 5));
                        if (d.drop1Day >= 10) s += 40; else if (d.drop1Day >= 5) s += 20;
                        if (d.rank > 0 && d.rank <= 1000) s += 30;
                        if (d.isLow90 && d.isLowAll) s += 15;

                        d.dealScore = Math.floor(s);
                        if (d.subCategory) subCats.add(d.subCategory);
                        return d;
                    } catch (e) {
                        console.error(`Row ${idx} failed to parse:`, e);
                        return null;
                    }
                }).filter(d => d !== null && d.price > 0 && d.url.includes('http') && !hiddenDeals.includes(d.url));

                const menu = document.getElementById('subCatSelect');
                menu.innerHTML = '<option value="All">All Categories</option>';
                Array.from(subCats).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    menu.appendChild(opt);
                });

                filterAndSort();
            } catch (err) { 
                console.error("Dashboard Load Error:", err);
                statusEl.innerText = "LOAD ERROR: CHECK CONSOLE";
                statusEl.classList.add("text-red-500");
            }
        }

        function filterAndSort() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const sub = document.getElementById('subCatSelect').value;
            
            let filtered = allDeals.filter(d => 
                (d.title.toLowerCase().includes(search) || d.subCategory.toLowerCase().includes(search)) && 
                (sub === "All" || d.subCategory === sub)
            );

            if (sort === "score") filtered.sort((a,b) => b.dealScore - a.dealScore);
            if (sort === "drop") filtered.sort((a,b) => b.drop1Day - a.drop1Day);
            if (sort === "rank") filtered.sort((a,b) => (a.rank || 999999) - (b.rank || 999999));
            render(filtered);
        }

        function handlePost(amazonUrl) {
            let cleanBase = amazonUrl.split('?')[0];
            if (!cleanBase.includes('http')) {
                alert("Error: Amazon URL is invalid in the spreadsheet.");
                return;
            }
            const finalLink = `${cleanBase}?tag=${CONFIG.AFFILIATE_TAG}`;
            navigator.clipboard.writeText(finalLink).then(() => alert("Affiliate Link Copied!"));
        }

        function hideCard(url) {
            let hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            hidden.push(url);
            localStorage.setItem('hiddenDeals', JSON.stringify(hidden));
            location.reload();
        }

        function resetHidden() { localStorage.removeItem('hiddenDeals'); location.reload(); }

        function render(deals) {
            const grid = document.getElementById('deal-grid');
            document.getElementById('deal-count').innerText = `${deals.length} ACTIVE DEALS`;
            grid.innerHTML = deals.map(d => `
                <div class="deal-card bg-white rounded-3xl border border-slate-200 p-5 flex flex-col relative shadow-sm">
                    <button onclick="hideCard('${d.url}')" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 font-bold">✕</button>
                    <div class="flex justify-between mb-2">
                        <span class="text-[9px] font-black text-blue-600 uppercase truncate max-w-[100px]">${d.subCategory}</span>
                        <div class="flex gap-1">
                            ${d.drop1Day >= 5 ? '<span class="bg-yellow-400 text-[8px] px-1 rounded font-black">⚡ FLASH</span>' : ''}
                            ${d.isLowAll ? '<span class="bg-red-100 text-red-600 text-[8px] px-1 rounded font-black">Year Low</span>' : ''}
                        </div>
                    </div>
                    <div class="h-32 flex items-center justify-center mb-4 bg-slate-50 rounded-xl p-2 relative">
                        <a href="${d.keepaUrl}" target="_blank" class="absolute bottom-2 right-2 bg-slate-900 text-white text-[8px] px-2 py-1 rounded font-bold">KEEPA ↗</a>
                        <img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply">
                    </div>
                    <h3 class="font-bold text-xs h-8 overflow-hidden mb-3 text-slate-800">${d.title}</h3>
                    <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl mb-4">
                        <div><p class="text-[8px] text-slate-400 uppercase">Price</p><p class="text-xl font-black text-slate-900">$${d.price.toFixed(2)}</p></div>
                        <div class="text-right"><p class="text-[8px] text-slate-400 uppercase">Score</p><p class="text-[10px] font-black text-orange-600">${d.dealScore}</p></div>
                    </div>
                    <button onclick="handlePost('${d.url}')" class="w-full bg-slate-900 text-white text-xs font-black py-3 rounded-xl shadow-lg">COPY LINK</button>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
