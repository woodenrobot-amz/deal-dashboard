<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WR Deal Command</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .deal-card { transition: all 0.2s ease-in-out; }
        #version-tag { position: fixed; bottom: 10px; right: 10px; font-size: 10px; font-weight: 900; color: #94a3b8; z-index: 100; pointer-events: none; }
        .hot-glow { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); border-color: #f87171 !important; }
        .bg-keepa { background-color: #0099cc; }
        
        /* Smooth Horizontal Scroll for Source Pills */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Robotic Arm Animation */
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
        }
        .animate-arm { 
            animation: wave 1.5s ease-in-out infinite; 
            transform-origin: bottom center;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

    <div id="version-tag">COMMAND V1.9.2 PWA</div>

    <!-- DELAYED LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative mb-6">
            <img src="https://img.icons8.com/color/96/robotic-arm.png" class="animate-arm w-24 h-24">
        </div>
        <h2 class="text-white font-black italic text-2xl tracking-tighter uppercase">Initializing <span class="text-blue-500">Command</span></h2>
        <p class="text-blue-300 text-[10px] font-black uppercase mt-2 tracking-widest animate-pulse">Scanning Deal Ecosystem...</p>
    </div>

    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-4 border-blue-600 px-4 py-4">
        <div class="max-w-[1800px] mx-auto flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 px-2 py-1 rounded-lg font-black italic text-xl">WR</div>
                    <h1 class="text-lg font-black uppercase italic tracking-tighter">Deal <span class="text-blue-500">Command</span></h1>
                </div>
                <!-- INCREASED FONT SIZE FOR ITEM COUNT -->
                <p id="deal-count" class="text-[12px] font-black text-blue-300 uppercase tracking-widest bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 shadow-inner">...</p>
            </div>
            
            <!-- REFINED SOURCE PILLS -->
            <div id="source-tabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar -mx-2 px-2"></div>

            <div class="flex flex-wrap gap-2">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." class="flex-grow bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2 text-white outline-none focus:border-blue-500">
                <select id="tagFilter" onchange="filterAndSort()" class="bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-yellow-500 outline-none font-bold text-sm">
                    <option value="All">All Deals</option>
                    <option value="Brand">★ Brands</option>
                    <option value="Flash">⚡ Flash</option>
                    <option value="Year">🏆 Year Low</option>
                    <option value="Hot">🔥 Hot</option>
                </select>
            </div>

            <div class="flex gap-2">
                <select id="sortSelect" onchange="filterAndSort()" class="flex-1 bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 font-bold text-white outline-none text-xs">
                    <option value="score">Sort: Score</option>
                    <option value="drop">Sort: % Drop</option>
                    <option value="rank">Sort: BSR</option>
                    <option value="priceLow">Price: L to H</option>
                    <option value="priceHigh">Price: H to L</option>
                </select>
                <!-- CATEGORY FIX: MAX-WIDTH TO PREVENT BREAKTHROUGH -->
                <select id="subCatSelect" onchange="filterAndSort()" class="max-w-[50%] flex-1 bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-white outline-none text-xs truncate">
                    <option value="All">All Categories</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="max-w-[1800px] mx-auto px-4 mt-6">
        <div id="deal-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
    </main>

    <script>
        let allDeals = [];
        let nameBrands = [];
        let currentSourceKey = Object.keys(CONFIG.SOURCES)[0];

        const forceNum = (val) => { if (!val) return 0; return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0; };
        const cleanStr = (val) => { if (!val) return ""; return String(val).replace(/["]/g, '').trim(); };

        const copyText = (text, btn, original) => {
            if(!text || text.length < 3) return;
            navigator.clipboard.writeText(text).then(() => {
                const oldColor = btn.classList.contains('bg-blue-600') ? 'bg-blue-600' : (btn.classList.contains('bg-orange-600') ? 'bg-orange-600' : 'bg-slate-900');
                btn.innerText = "COPIED!";
                btn.classList.replace(oldColor, 'bg-green-600');
                setTimeout(() => { btn.innerText = original; btn.classList.replace('bg-green-600', oldColor); }, 1000);
            });
        };

        function parseCSVLine(line) {
            const result = []; let cur = ''; let inQuote = false;
            for (let char of line) {
                if (char === '"') inQuote = !inQuote;
                else if (char === ',' && !inQuote) { result.push(cur); cur = ''; } 
                else cur += char;
            }
            result.push(cur); return result;
        }

        function switchSource(key) {
            currentSourceKey = key;
            localStorage.setItem('lastUsedSource', key);
            
            // RESET FILTERS ON SWITCH
            document.getElementById('searchBox').value = "";
            document.getElementById('tagFilter').value = "All";
            document.getElementById('subCatSelect').value = "All";
            
            document.getElementById('deal-grid').innerHTML = '<div class="col-span-full py-20 text-center font-black text-slate-400 animate-pulse uppercase text-xl">Loading Group...</div>';
            init();
        }

        function buildSourceTabs() {
            const container = document.getElementById('source-tabs');
            container.innerHTML = '';
            Object.keys(CONFIG.SOURCES).forEach(key => {
                const source = CONFIG.SOURCES[key];
                const btn = document.createElement('button');
                btn.innerText = source.name;
                const isActive = currentSourceKey === key;
                btn.className = `whitespace-nowrap px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all flex-shrink-0 ${isActive ? 'bg-blue-600 text-white scale-105 ring-2 ring-blue-400' : 'bg-slate-800 text-slate-400'}`;
                btn.onclick = () => switchSource(key);
                container.appendChild(btn);
            });
        }

        async function init() {
            buildSourceTabs();
            try {
                if (CONFIG.BRAND_LIST_URL) {
                    const br = await fetch(`${CONFIG.BRAND_LIST_URL}&cb=${Date.now()}`);
                    const bd = await br.text();
                    nameBrands = bd.split(/\r?\n/).map(b => b.replace(/"/g, '').trim()).filter(b => b !== "");
                }
                const res = await fetch(`${CONFIG.SOURCES[currentSourceKey].url}&cb=${Date.now()}`);
                const data = await res.text();
                const lines = data.split(/\r?\n/).filter(l => l.trim() !== "");
                const rows = lines.slice(1);
                const subCats = new Set();
                const hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');

                allDeals = rows.map((row) => {
                    const cols = parseCSVLine(row);
                    if (cols.length < 13) return null;
                    const title = cleanStr(cols[1]);
                    const bsr = forceNum(cols[10]);
                    const isNameBrand = nameBrands.some(brand => title.toLowerCase().includes(brand.toLowerCase()));
                    const d = {
                        img: cleanStr(cols[0]), title, price: forceNum(cols[2]), avg90: forceNum(cols[3]),
                        drop1Day: forceNum(cols[4]), isLowAll: String(cols[6]).toUpperCase().includes('YES'),
                        category: cleanStr(cols[8] || "General"), rank: bsr, url: cleanStr(cols[11]),
                        keepa: cleanStr(cols[12]), rating: forceNum(cols[13]), asin: cleanStr(cols[14]),
                        isNameBrand, isHot: bsr > 0 && bsr <= 5000
                    };
                    let s = (d.rating * (forceNum(CONFIG.WEIGHT_RATING) || 5));
                    if (d.avg90 > d.price) s += (((d.avg90 - d.price) / d.avg90) * 100 * (forceNum(CONFIG.WEIGHT_SAVINGS) || 1.5));
                    if (d.drop1Day >= 5) s += 20; if (d.isHot) s += 30; if (d.isLowAll) s += 15; if (d.isNameBrand) s += 15;
                    d.dealScore = Math.floor(s);
                    subCats.add(d.category);
                    return d;
                }).filter(d => d !== null && d.price > 0 && !hidden.includes(d.url));

                const menu = document.getElementById('subCatSelect');
                menu.innerHTML = '<option value="All">All Categories</option>';
                Array.from(subCats).sort().forEach(c => {
                    const opt = document.createElement('option'); opt.value = c; opt.innerText = c;
                    menu.appendChild(opt);
                });

                filterAndSort();

                // HIDE LOADING SCREEN AFTER 3 SECONDS
                setTimeout(() => {
                    const loader = document.getElementById('loading-screen');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 3000);

            } catch (err) { console.error(err); }
        }

        function filterAndSort() {
            const s = document.getElementById('searchBox').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const sub = document.getElementById('subCatSelect').value;
            const tag = document.getElementById('tagFilter').value;
            let f = allDeals.filter(d => d.title.toLowerCase().includes(s) && (sub === "All" || d.category === sub) && (tag === "All" || (tag === "Flash" && d.drop1Day >= 5) || (tag === "Year" && d.isLowAll) || (tag === "Hot" && d.isHot) || (tag === "Brand" && d.isNameBrand)));
            if (sort === "score") f.sort((a,b) => b.dealScore - a.dealScore);
            if (sort === "drop") f.sort((a,b) => b.drop1Day - a.drop1Day);
            if (sort === "rank") f.sort((a,b) => (a.rank || 999999) - (b.rank || 999999));
            if (sort === "priceLow") f.sort((a,b) => a.price - b.price);
            if (sort === "priceHigh") f.sort((a,b) => b.price - a.price);
            render(f);
        }

        function hideCard(url) {
            let h = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            h.push(url); localStorage.setItem('hiddenDeals', JSON.stringify(h));
            filterAndSort();
        }

        function resetHidden() { localStorage.removeItem('hiddenDeals'); location.reload(); }

        function render(deals) {
            const grid = document.getElementById('deal-grid');
            document.getElementById('deal-count').innerText = `${deals.length} ITEMS`;
            grid.innerHTML = deals.map(d => {
                const amz = `https://www.amazon.com/dp/${d.asin}/?tag=${CONFIG.AFFILIATE_TAG}`;
                return `
                <div class="deal-card bg-white rounded-[2rem] border-2 border-slate-200 p-5 flex flex-col relative ${d.isHot ? 'hot-glow' : ''}">
                    <button onclick="hideCard('${d.url}')" class="absolute top-3 right-3 z-30 bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-black shadow-md">✕</button>
                    <div class="flex flex-wrap gap-1 mb-3">
                        ${d.isNameBrand ? '<span class="bg-slate-900 text-white text-[9px] font-black px-2 py-1 rounded-lg">★ BRAND</span>' : ''}
                        ${d.isHot ? '<span class="bg-orange-500 text-white text-[9px] font-black px-2 py-1 rounded-lg">🔥 HOT</span>' : ''}
                        ${d.drop1Day >= 5 ? '<span class="bg-yellow-400 text-yellow-900 text-[9px] font-black px-2 py-1 rounded-lg">⚡ FLASH</span>' : ''}
                        ${d.isLowAll ? '<span class="bg-red-600 text-white text-[9px] font-black px-2 py-1 rounded-lg">🏆 YEAR LOW</span>' : ''}
                    </div>
                    <div class="h-40 flex items-center justify-center mb-4 bg-slate-50 rounded-2xl p-4 relative group">
                        <img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply">
                        <a href="${d.keepa}" target="_blank" class="absolute bottom-2 right-2 bg-keepa text-white text-[9px] font-black px-3 py-1 rounded-lg shadow-lg">KEEPA ↗</a>
                    </div>
                    <h3 class="font-bold text-lg leading-tight h-20 overflow-hidden mb-4 text-slate-800">${d.title}</h3>
                    <div class="mb-5 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <div class="flex justify-between items-center mb-2">
                            <div><p class="text-[9px] text-slate-400 uppercase font-black">Price</p><p class="text-xl font-black text-slate-900">$${d.price.toFixed(2)}</p></div>
                            <div class="text-right"><p class="text-[9px] text-slate-400 uppercase font-black">90d Avg</p><p class="text-sm font-bold text-slate-300 line-through">$${d.avg90.toFixed(2)}</p></div>
                        </div>
                        <div class="border-t border-slate-200 pt-2 flex justify-between items-center mb-2"><span class="text-[9px] font-black text-slate-400">SCORE</span><span class="text-xl font-black text-orange-600">${d.dealScore}</span></div>
                        <div class="bg-white border border-slate-200 px-2 py-1 rounded-lg text-center"><span class="text-[9px] font-black text-blue-600 uppercase italic">${d.category}</span></div>
                    </div>
                    <div class="space-y-2 mt-auto">
                        <a href="${amz}" target="_blank" class="block text-center bg-orange-600 text-white text-[10px] font-black py-3 rounded-xl uppercase tracking-widest">VIEW ON AMAZON</a>
                        <button onclick="copyText('${amz}', this, 'COPY LINK')" class="w-full bg-slate-900 text-white text-[10px] font-black py-2 rounded-xl uppercase tracking-widest">COPY LINK</button>
                        <button onclick="copyText('${d.asin}', this, 'ASIN: ${d.asin}')" class="w-full bg-blue-600 text-white text-[9px] font-black py-2 rounded-xl uppercase">ASIN: ${d.asin}</button>
                    </div>
                </div>`;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('lastUsedSource');
            if (saved && CONFIG.SOURCES[saved]) currentSourceKey = saved;
            init();
        });
    </script>
</body>
</html>
