<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wooden Robot Reviews | Deal Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .deal-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .deal-card:hover { transform: translateY(-5px); }
        .bg-glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

    <!-- Sticky Header -->
    <nav class="sticky top-0 z-50 bg-slate-900 text-white p-4 shadow-2xl border-b-2 border-blue-500">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic tracking-tighter">WOODEN ROBOT <span class="text-blue-500">V1.1</span></h1>
                <p id="deal-count" class="text-[10px] text-blue-300 font-bold uppercase tracking-widest">Initialising Dashboard...</p>
            </div>
            <button onclick="resetHidden()" class="text-[10px] border border-slate-700 px-3 py-1 rounded hover:bg-slate-800 transition-colors">
                RESET HIDDEN
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 mt-8">
        <div id="deal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will inject here -->
        </div>
    </main>

    <script>
        // CONFIGURATION
        const CSV_BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1QglaKzDDE5441XFT9FAhJgp7lK75YqysOo1ctQbXI1-g46k10vPG9E5MoihGd4g9bsgBnuL2IoMu/pub?output=csv';
        const AFFILIATE_ID = "YOUR_AFFILIATE_ID";
        const POSTTAP_PREFIX = "https://ptap.it/yourhandle/"; 

        async function init() {
            try {
                // Cache-busting: adds a timestamp so the browser doesn't show old data
                const response = await fetch(`${CSV_BASE_URL}&cacheBust=${Date.now()}`);
                const data = await response.text();
                const rows = data.split('\n').slice(1); 
                const hiddenDeals = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
                
                let allDeals = rows.map(row => {
                    const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (!cols || cols.length < 11) return null;

                    // MAPPING: Img(0), Title(1), Price(2), 90Avg(3), L90(4), LAll(5), Rat(6), Rev(7), Cat(8), Change(9), Rank(10), URL(11)
                    const d = {
                        img: cols[0].replace(/"/g, ''),
                        title: cols[1].replace(/"/g, ''),
                        price: parseFloat(cols[2].replace(/[$,]/g, '')),
                        avg90: parseFloat(cols[3].replace(/[$,]/g, '')),
                        isLow90: cols[4].toUpperCase().includes('TRUE'),
                        isLowAll: cols[5].toUpperCase().includes('TRUE'),
                        rating: parseFloat(cols[6]),
                        reviews: cols[7],
                        category: cols[8].replace(/"/g, '').trim(),
                        lastChange: cols[9], 
                        rank: parseInt(cols[10].replace(/[,#]/g, '')),
                        url: cols[11].replace(/"/g, '')
                    };

                    // --- SCORING ENGINE ---
                    const savingsPct = ((d.avg90 - d.price) / d.avg90) * 100;
                    let score = savingsPct * 1.5; 

                    // Rank Velocity Boost
                    if (d.rank <= 500) score += 35;
                    else if (d.rank <= 2000) score += 20;
                    else if (d.rank <= 10000) score += 10;

                    // Quality Multiplier
                    score += (d.rating * 5);

                    d.dealScore = Math.round(score);
                    return d;
                }).filter(d => d !== null && d.rating >= 4.2 && !hiddenDeals.includes(d.url));

                // Sort: Highest Score First
                allDeals.sort((a, b) => b.dealScore - a.dealScore);

                renderDeals(allDeals);
                document.getElementById('deal-count').innerText = `${allDeals.length} HIGH-VALUE DEALS ACTIVE`;
            } catch (err) {
                console.error("Dashboard Error:", err);
            }
        }

        function handlePost(url) {
            const fullUrl = url.includes('?') ? `${url}&tag=${AFFILIATE_ID}` : `${url}?tag=${AFFILIATE_ID}`;
            const deepLink = `${POSTTAP_PREFIX}${encodeURIComponent(fullUrl)}`;
            
            navigator.clipboard.writeText(deepLink).then(() => {
                alert("Deep Link Copied! Opening Amazon...");
                window.open(deepLink, '_blank');
            });
        }

        function hideCard(url) {
            let hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            hidden.push(url);
            localStorage.setItem('hiddenDeals', JSON.stringify(hidden));
            init(); // Re-render without refreshing the whole page
        }

        function resetHidden() {
            localStorage.removeItem('hiddenDeals');
            location.reload();
        }

        function renderDeals(deals) {
            const grid = document.getElementById('deal-grid');
            grid.innerHTML = deals.map(d => `
                <div class="deal-card group bg-white rounded-[2rem] border border-slate-200 overflow-hidden flex flex-col relative shadow-sm hover:shadow-xl">
                    <!-- Hide Button -->
                    <button onclick="hideCard('${d.url}')" class="absolute top-4 right-4 z-30 bg-white/90 hover:bg-red-500 hover:text-white w-8 h-8 rounded-full text-xs shadow-sm flex items-center justify-center transition-all">✕</button>
                    
                    <div class="p-6 flex-grow flex flex-col">
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black text-blue-600 uppercase tracking-tighter">${d.category}</span>
                                <span class="text-xs font-bold text-slate-400">Score: ${d.dealScore}</span>
                            </div>
                            ${d.isLowAll ? '<span class="bg-red-100 text-red-600 text-[9px] font-black px-2 py-1 rounded-md">YEAR LOW</span>' : 
                              d.isLow90 ? '<span class="bg-blue-100 text-blue-600 text-[9px] font-black px-2 py-1 rounded-md">90D LOW</span>' : ''}
                        </div>

                        <div class="h-44 flex items-center justify-center mb-4 bg-slate-50 rounded-2xl p-4">
                            <img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform">
                        </div>

                        <h3 class="font-bold text-sm leading-tight h-10 overflow-hidden mb-4 text-slate-800">${d.title}</h3>
                        
                        <div class="mt-auto pt-4 border-t border-slate-50">
                            <div class="flex justify-between items-end mb-6">
                                <div>
                                    <p class="text-[9px] text-slate-400 font-black uppercase">Deal Price</p>
                                    <p class="text-3xl font-black text-slate-900 leading-none">$${d.price.toFixed(2)}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] text-slate-400 font-black uppercase">BSR Rank</p>
                                    <p class="text-xs font-bold text-slate-700">#${d.rank.toLocaleString()}</p>
                                </div>
                            </div>

                            <button onclick="handlePost('${d.url}')" 
                                class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-blue-600 transition-all shadow-lg active:scale-95">
                                GENERATE POST LINK
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
