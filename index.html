<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wooden Robot | Command v1.6.1</title>
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .deal-card { transition: all 0.2s ease-in-out; }
        .deal-card:hover { transform: translateY(-4px); }
        #version-tag { position: fixed; bottom: 10px; right: 10px; font-size: 10px; font-weight: 900; color: #94a3b8; z-index: 100; }
        .btn-shadow { box-shadow: 0 4px 0 0 rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

    <div id="version-tag">COMMAND V1.6.1</div>

    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-4 border-blue-600 px-6 py-4">
        <div class="max-w-[1800px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 px-3 py-1 rounded-lg font-black italic text-2xl text-white">WR</div>
                <h1 class="text-xl font-black uppercase italic tracking-tighter">Deal <span class="text-blue-500">Command</span></h1>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." class="bg-slate-800 border-2 border-slate-700 rounded-lg px-4 py-2 text-white outline-none w-48 focus:border-blue-500">
                
                <select id="sortSelect" onchange="filterAndSort()" class="bg-slate-800 border-2 border-slate-700 rounded-lg px-2 py-2 font-bold text-white outline-none">
                    <option value="score">Sort: Score</option>
                    <option value="drop">Sort: % Drop</option>
                    <option value="rank">Sort: BSR (Low First)</option>
                </select>

                <select id="subCatSelect" onchange="filterAndSort()" class="bg-slate-800 border-2 border-slate-700 rounded-lg px-2 py-2 text-white outline-none">
                    <option value="All">Categories</option>
                </select>

                <select id="tagFilter" onchange="filterAndSort()" class="bg-slate-800 border-2 border-slate-700 rounded-lg px-2 py-2 text-yellow-500 outline-none font-bold">
                    <option value="All">All Deals</option>
                    <option value="Flash">⚡ Flash</option>
                    <option value="Year">🏆 Year Low</option>
                </select>
                
                <button onclick="resetHidden()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-black uppercase">Reset</button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1800px] mx-auto px-6 mt-8">
        <div id="deal-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
    </main>

    <script>
        let allDeals = [];

        const forceNum = (val) => {
            if (!val) return 0;
            const cleaned = String(val).replace(/[^0-9.-]/g, '');
            return parseFloat(cleaned) || 0;
        };

        const cleanStr = (val) => {
            if (!val) return "";
            return String(val).replace(/["\s]/g, '').trim();
        };

        const copyText = (text, btn, original) => {
            if(!text || text.length < 3) return;
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = "COPIED!";
                setTimeout(() => { btn.innerText = original; }, 1000);
            });
        };

        async function init() {
            try {
                const response = await fetch(`${CONFIG.CSV_URL}&cb=${Date.now()}`);
                const csvData = await response.text();
                const rows = csvData.split(/\r?\n/).filter(line => line.trim() !== "").slice(1);
                const subCats = new Set();
                const hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');

                allDeals = rows.map((row) => {
                    const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                    if (!cols || cols.length < 13) return null;

                    const d = {
                        img: cleanStr(cols[0]),
                        title: (cols[1] || "").replace(/"/g, ''),
                        price: forceNum(cols[2]),
                        avg90: forceNum(cols[3]),
                        drop1Day: forceNum(cols[4]),
                        isLowAll: String(cols[6]).toUpperCase().includes('YES'),
                        category: (cols[8] || "General").replace(/"/g, '').trim(),
                        rank: forceNum(cols[10]),
                        url: cleanStr(cols[11]),
                        keepa: cleanStr(cols[12]),
                        rating: forceNum(cols[13]),
                        asin: cleanStr(cols[14]) // Index 14 = Column O
                    };

                    // --- CALIBRATED MATH ---
                    let s = 0;
                    if (d.avg90 > 0 && d.price > 0) {
                        let pct = Math.min(((d.avg90 - d.price) / d.avg90) * 100, 100);
                        s += (pct * (forceNum(CONFIG.WEIGHT_SAVINGS) || 1.5));
                    }
                    s += (d.rating * (forceNum(CONFIG.WEIGHT_RATING) || 5));
                    if (d.drop1Day >= 10) s += 40; else if (d.drop1Day >= 5) s += 20;
                    if (d.rank > 0 && d.rank <= 2000) s += 25;
                    if (d.isLowAll) s += 15;

                    d.dealScore = Math.floor(s);
                    if (d.category) subCats.add(d.category);
                    return d;
                }).filter(d => d !== null && d.price > 0 && !hidden.includes(d.url));

                const menu = document.getElementById('subCatSelect');
                Array.from(subCats).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    menu.appendChild(opt);
                });

                filterAndSort();
            } catch (err) { console.error(err); }
        }

        function filterAndSort() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const sub = document.getElementById('subCatSelect').value;
            const tag = document.getElementById('tagFilter').value;
            
            let filtered = allDeals.filter(d => 
                (d.title.toLowerCase().includes(search) || d.category.toLowerCase().includes(search)) && 
                (sub === "All" || d.category === sub) &&
                (tag === "All" || (tag === "Flash" && d.drop1Day >= 5) || (tag === "Year" && d.isLowAll))
            );

            if (sort === "score") filtered.sort((a,b) => b.dealScore - a.dealScore);
            if (sort === "drop") filtered.sort((a,b) => b.drop1Day - a.drop1Day);
            if (sort === "rank") filtered.sort((a,b) => (a.rank || 999999) - (b.rank || 999999));
            render(filtered);
        }

        function hideCard(url) {
            let hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            hidden.push(url);
            localStorage.setItem('hiddenDeals', JSON.stringify(hidden));
            filterAndSort();
        }

        function resetHidden() { localStorage.removeItem('hiddenDeals'); location.reload(); }

        function render(deals) {
            const grid = document.getElementById('deal-grid');
            document.getElementById('deal-count').innerText = `${deals.length} ITEMS`;
            grid.innerHTML = deals.map(d => `
                <div class="deal-card bg-white rounded-[2rem] border-2 border-slate-200 p-5 flex flex-col relative shadow-sm">
                    <button onclick="hideCard('${d.url}')" class="absolute top-3 right-3 z-30 bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-black shadow-md hover:scale-110 transition-all">✕</button>
                    
                    <div class="flex flex-wrap gap-1 mb-3">
                        <span class="text-[9px] font-black text-blue-600 uppercase bg-blue-50 px-2 py-0.5 rounded">${d.category}</span>
                        ${d.drop1Day >= 5 ? '<span class="bg-yellow-400 text-yellow-900 text-[10px] font-black px-2 py-0.5 rounded uppercase">⚡ FLASH</span>' : ''}
                        ${d.isLowAll ? '<span class="bg-red-100 text-red-600 text-[10px] font-black px-2 py-0.5 rounded uppercase">🏆 YEAR</span>' : ''}
                    </div>

                    <div class="h-40 flex items-center justify-center mb-4 bg-slate-50 rounded-2xl p-4 relative group">
                        <img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply group-hover:scale-105 transition-all">
                        <a href="${d.keepa}" target="_blank" class="absolute bottom-2 right-2 bg-orange-500 text-white text-[9px] font-black px-3 py-1.5 rounded-lg shadow hover:bg-orange-600 transition-all">KEEPA ↗</a>
                    </div>

                    <h3 class="font-bold text-lg leading-tight h-12 overflow-hidden mb-4 text-slate-800">${d.title}</h3>
                    
                    <div class="grid grid-cols-2 gap-3 mb-5 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <div>
                            <p class="text-[9px] text-slate-400 uppercase font-black">Price</p>
                            <p class="text-xl font-black text-slate-900">$${d.price.toFixed(2)}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-slate-400 uppercase font-black">90d Avg</p>
                            <p class="text-sm font-bold text-slate-400 line-through">$${d.avg90.toFixed(2)}</p>
                        </div>
                        <div class="col-span-2 border-t pt-2 flex justify-between">
                            <span class="text-[9px] font-black text-slate-400 uppercase">Score</span>
                            <span class="text-lg font-black text-orange-600">${d.dealScore}</span>
                        </div>
                    </div>

                    <div class="space-y-2 mt-auto">
                        <button onclick="copyText('${d.url.split('?')[0]}?tag=${CONFIG.AFFILIATE_TAG}', this, 'COPY AFFILIATE LINK')" 
                                class="w-full bg-slate-900 text-white text-[10px] font-black py-4 rounded-xl btn-shadow uppercase tracking-widest">
                            COPY AFFILIATE LINK
                        </button>
                        <button onclick="copyText('${d.asin}', this, 'COPY ASIN: ${d.asin}')" 
                                class="w-full bg-blue-600 text-white text-[10px] font-black py-2 rounded-lg btn-shadow uppercase opacity-90">
                            COPY ASIN: ${d.asin}
                        </button>
                    </div>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
