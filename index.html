<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wooden Robot | Command v1.2.3</title>
    
    <!-- Reference your external config -->
    <script src="config.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .deal-card { transition: all 0.2s ease-in-out; }
        .deal-card:hover { transform: translateY(-4px); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10 custom-scroll">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-2 border-blue-600 px-6 py-4">
        <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 px-3 py-1 rounded-lg font-black italic tracking-tighter text-2xl text-white">WR</div>
                <div>
                    <h1 class="text-lg font-black tracking-tighter uppercase italic leading-none text-white">Deal <span class="text-blue-500">Command</span></h1>
                    <p id="deal-count" class="text-[9px] font-bold text-blue-300 uppercase tracking-widest mt-1 text-white text-white">Initializing...</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." 
                       class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none w-48 text-white">
                
                <select id="sortSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none text-white">
                    <option value="score">Sort: Score</option>
                    <option value="price-low">Sort: Price (Low)</option>
                    <option value="newest">Sort: Newest Drop</option>
                    <option value="rank">Sort: BSR Rank</option>
                </select>

                <select id="catSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none text-white">
                    <option value="All">All Categories</option>
                </select>

                <button onclick="resetHidden()" class="bg-red-900/20 text-red-400 border border-red-800/50 px-3 py-2 rounded-lg text-[10px] font-bold hover:bg-red-600 hover:text-white transition-all">
                    RESET HIDDEN
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-6 mt-8 text-white">
        <div id="deal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
            <!-- Cards -->
        </div>
    </main>

    <script>
        let allDeals = [];

        async function init() {
            try {
                const response = await fetch(`${CONFIG.CSV_URL}&cb=${Date.now()}`);
                const csvData = await response.text();
                const rows = csvData.split(/\r?\n/).slice(1);
                const hiddenDeals = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
                const cats = new Set();

                allDeals = rows.map(row => {
                    const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                    if (!cols || cols.length < 13) return null;

                    const d = {
                        img: cols[0].replace(/"/g, ''),
                        title: cols[1].replace(/"/g, ''),
                        price: parseFloat(cols[2].replace(/[$,]/g, '')),
                        avg90: parseFloat(cols[3].replace(/[$,]/g, '')),
                        isLow90: cols[4].toUpperCase().includes('TRUE'),
                        isLowAll: cols[5].toUpperCase().includes('TRUE'),
                        rating: parseFloat(cols[6]),
                        reviews: cols[7],
                        category: cols[8].replace(/"/g, '').trim(),
                        lastChangeRaw: cols[9].replace(/"/g, ''), 
                        rank: parseInt(cols[10].replace(/[,#]/g, '')),
                        url: cols[11].replace(/"/g, '').trim(),
                        keepaUrl: cols[12]?.replace(/"/g, '').trim() || '#'
                    };

                    d.lastChangeDate = d.lastChangeRaw.split(' ')[0];

                    const savingsPct = ((d.avg90 - d.price) / d.avg90) * 100;
                    let score = savingsPct * CONFIG.WEIGHT_SAVINGS;
                    if (d.rank <= 500) score += 35;
                    else if (d.rank <= 2000) score += 20;
                    score += (d.rating * CONFIG.WEIGHT_RATING);
                    
                    d.dealScore = Math.round(score);
                    if (d.category) cats.add(d.category);
                    return d;
                }).filter(d => d !== null && d.rating >= CONFIG.MIN_RATING && !hiddenDeals.includes(d.url));

                const catMenu = document.getElementById('catSelect');
                Array.from(cats).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    catMenu.appendChild(opt);
                });

                filterAndSort();
            } catch (err) { console.error("Initialization Failed:", err); }
        }

        function filterAndSort() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const cat = document.getElementById('catSelect').value;
            
            let filtered = allDeals.filter(d => 
                d.title.toLowerCase().includes(search) && (cat === "All" || d.category === cat)
            );

            if (sort === "score") filtered.sort((a,b) => b.dealScore - a.dealScore);
            if (sort === "price-low") filtered.sort((a,b) => a.price - b.price);
            if (sort === "rank") filtered.sort((a,b) => a.rank - b.rank);
            if (sort === "newest") filtered.sort((a,b) => new Date(b.lastChangeRaw) - new Date(a.lastChangeRaw));

            render(filtered);
        }

        function handlePost(amazonUrl) {
            // Build the standard Amazon Affiliate Link
            const baseUrl = amazonUrl.split('?')[0];
            const finalAffiliateLink = `${baseUrl}?tag=${CONFIG.AFFILIATE_TAG}`;
            
            navigator.clipboard.writeText(finalAffiliateLink).then(() => {
                alert("Affiliate Link Copied!\nPaste into PostTap now.");
                window.open(finalAffiliateLink, '_blank');
            });
        }

        function hideCard(url) {
            let hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            hidden.push(url);
            localStorage.setItem('hiddenDeals', JSON.stringify(hidden));
            init();
        }

        function resetHidden() { localStorage.removeItem('hiddenDeals'); location.reload(); }

        function render(deals) {
            const grid = document.getElementById('deal-grid');
            document.getElementById('deal-count').innerText = `${deals.length} SELECTIVE DEALS ACTIVE`;
            grid.innerHTML = deals.map(d => `
                <div class="deal-card bg-white rounded-3xl border border-slate-200 overflow-hidden flex flex-col relative shadow-sm">
                    <button onclick="hideCard('${d.url}')" class="absolute top-3 right-3 z-30 bg-white/90 hover:bg-red-500 hover:text-white w-7 h-7 rounded-full text-[10px] shadow flex items-center justify-center transition-all">✕</button>
                    
                    <div class="p-5 flex-grow flex flex-col">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] font-black text-blue-600 uppercase tracking-tighter">${d.category}</span>
                            <div class="flex gap-1">
                                ${d.isLowAll ? '<span class="bg-red-100 text-red-600 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Year</span>' : ''}
                                ${d.isLow90 ? '<span class="bg-blue-100 text-blue-600 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">90d</span>' : ''}
                            </div>
                        </div>

                        <div class="h-36 flex items-center justify-center mb-4 bg-slate-50 rounded-xl p-2 relative">
                            <a href="${d.keepaUrl}" target="_blank" class="absolute bottom-2 right-2 bg-slate-900 text-white text-[8px] px-2 py-1 rounded hover:bg-blue-600 transition-all font-bold text-white text-white">KEEPA ↗</a>
                            <img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply">
                        </div>

                        <h3 class="font-bold text-xs leading-tight h-8 overflow-hidden mb-3 text-slate-800">${d.title}</h3>
                        
                        <div class="grid grid-cols-2 gap-2 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div>
                                <p class="text-[8px] text-slate-400 font-black uppercase">Current</p>
                                <p class="text-xl font-black text-slate-900">$${d.price.toFixed(2)}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[8px] text-slate-400 font-black uppercase">90d Avg</p>
                                <p class="text-sm font-bold text-slate-400 line-through">$${d.avg90.toFixed(2)}</p>
                            </div>
                            <div class="mt-1">
                                <p class="text-[8px] text-slate-400 font-black uppercase tracking-tighter">Dropped</p>
                                <p class="text-[9px] font-bold text-slate-600">${d.lastChangeDate}</p>
                            </div>
                            <div class="text-right mt-1">
                                <p class="text-[8px] text-slate-400 font-black uppercase">Score</p>
                                <p class="text-[10px] font-black text-orange-600">${d.dealScore}</p>
                            </div>
                        </div>

                        <button onclick="handlePost('${d.url}')" 
                            class="w-full bg-slate-900 text-white text-xs font-black py-3 rounded-xl hover:bg-blue-600 transition-all shadow-lg active:scale-95 text-white">
                            COPY AFFILIATE LINK
                        </button>
                    </div>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
