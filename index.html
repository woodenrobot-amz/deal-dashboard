<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WR Deal Command</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

  <script src="config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap");

    body {
      font-family: "Inter", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .loader-container {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: #3b82f6;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
      background-color: #60a5fa;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
      background-color: #93c5fd;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(0.5);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    .deal-card {
      transition: all 0.2s ease-in-out;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hot-glow {
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      border-color: #f87171 !important;
    }

    .bg-keepa {
      background-color: #0099cc;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen pb-10">

  <div id="loading-screen" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="loader-container mb-6">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <h2 class="text-white font-black italic text-xl tracking-tighter uppercase">WR Command</h2>
  </div>

  <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-4 border-blue-600 px-4 py-4">
    <div class="max-w-[1800px] mx-auto flex flex-col gap-4">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="bg-blue-600 px-2 py-1 rounded-lg font-black italic text-xl">WR</div>
          <h1 class="text-lg font-black uppercase italic tracking-tighter">Deal Command</h1>
        </div>
        <p id="deal-count" class="text-sm font-black text-blue-300 uppercase bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">...</p>
      </div>

      <div id="source-tabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar -mx-4 px-4"></div>

      <div class="flex gap-2">
        <input
          type="text"
          id="searchBox"
          onkeyup="filterAndSort()"
          placeholder="Search..."
          class="flex-grow bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2 text-white outline-none focus:border-blue-500"
        />

        <select id="tagFilter" onchange="filterAndSort()" class="bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-yellow-500 outline-none font-bold text-sm">
          <option value="All">All</option>
          <option value="Brand">★ Brands</option>
          <option value="Hot">🔥 Hot</option>
          <option value="Saved">★ Saved</option>
          <option value="Excellent">✅ Excellent</option>
          <option value="Good">👍 Good</option>
          <option value="Junk">🗑️ Junk</option>
          <option value="Untagged">Untagged</option>
        </select>
      </div>

      <div class="flex gap-2">
        <select id="sortSelect" onchange="filterAndSort()" class="flex-1 bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 font-bold text-white outline-none text-xs">
          <option value="score">Score</option>
          <option value="priceLow">Price: L to H</option>
          <option value="priceHigh">Price: H to L</option>
          <option value="rank">BSR</option>
          <option value="rating">Rating</option>
          <option value="reviews">Reviews</option>
        </select>

        <select id="subCatSelect" onchange="filterAndSort()" class="flex-1 max-w-[170px] bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-white outline-none text-xs truncate">
          <option value="All">All Streams</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="max-w-[1800px] mx-auto px-4 mt-6">
    <div id="deal-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
  </main>

  <script>
    let allDeals = [];
    let nameBrands = [];
    let currentSourceKey = "All";

    const cleanStr = value => String(value || "").replace(/["]/g, "").trim();

    function money(value) {
      const num = Number(value);
      return Number.isFinite(num) && num > 0 ? `$${num.toFixed(2)}` : "N/A";
    }

    function safeNumber(value, fallback = 0) {
      const num = Number(value);
      return Number.isFinite(num) ? num : fallback;
    }

    function getSavedDeals() {
      return JSON.parse(localStorage.getItem("mySavedDeals")) || [];
    }

    function getDealTags() {
      return JSON.parse(localStorage.getItem("dealTags")) || {};
    }

    function setDealTag(asin, tag) {
      const tags = getDealTags();

      if (tag === "none") {
        delete tags[asin];
      } else {
        tags[asin] = tag;
      }

      localStorage.setItem("dealTags", JSON.stringify(tags));
      filterAndSort();
    }

    function toggleBookmark(asin) {
      let saved = getSavedDeals();

      if (saved.includes(asin)) {
        saved = saved.filter(id => id !== asin);
      } else {
        saved.push(asin);
      }

      localStorage.setItem("mySavedDeals", JSON.stringify(saved));
      filterAndSort();
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.innerText;
        btn.innerText = "COPIED!";
        setTimeout(() => btn.innerText = old, 1000);
      });
    }

    function buildAffiliateUrl(asin) {
      return `https://www.amazon.com/dp/${asin}/?tag=${CONFIG.AFFILIATE_TAG}`;
    }

    async function loadBrandList() {
      if (!CONFIG.BRAND_LIST_URL) return [];

      try {
        const res = await fetch(`${CONFIG.BRAND_LIST_URL}&cb=${Date.now()}`);
        const text = await res.text();

        return text
          .split(/\r?\n/)
          .map(b => b.trim())
          .filter(Boolean);
      } catch (err) {
        console.warn("Brand list failed to load:", err);
        return [];
      }
    }

    function enrichDeals(deals) {
      return deals.map(d => {
        const title = cleanStr(d.title);
        const asin = cleanStr(d.asin);
        const category = cleanStr(d.category || "uncategorized");

        const isNameBrand = nameBrands.some(
          b => title.toLowerCase().includes(b.toLowerCase())
        );

        return {
          ...d,
          asin,
          title,
          category,
          price: safeNumber(d.price, 0),
          avg90: safeNumber(d.avg90, 0),
          rating: safeNumber(d.rating, 0),
          reviewCount: safeNumber(d.reviewCount, 0),
          rank: safeNumber(d.rank, 999999),
          dealScore: safeNumber(d.dealScore, 0),
          img: cleanStr(d.img),
          keepa: cleanStr(d.keepa),
          isHot: Boolean(d.isHot),
          isLowAll: Boolean(d.isLowAll),
          isNameBrand
        };
      });
    }

    function renderSourceTabs() {
      const container = document.getElementById("source-tabs");
      const streams = ["All", ...new Set(allDeals.map(d => d.category).filter(Boolean))];

      container.innerHTML = streams.map(stream => `
        <button
          onclick="switchSource('${stream}')"
          class="whitespace-nowrap px-4 py-2 rounded-xl text-[10px] font-black uppercase ${
            currentSourceKey === stream
              ? "bg-blue-600 text-white"
              : "bg-slate-800 text-slate-400"
          }"
        >
          ${stream.replaceAll("_", " ").replaceAll(",", " + ")}
        </button>
      `).join("");
    }

    function renderCategoryOptions() {
      const select = document.getElementById("subCatSelect");
      const categories = [...new Set(allDeals.map(d => d.category).filter(Boolean))];

      select.innerHTML = `
        <option value="All">All Streams</option>
        ${categories.map(cat => `<option value="${cat}">${cat.replaceAll("_", " ").replaceAll(",", " + ")}</option>`).join("")}
      `;
    }

    async function init() {
      const loading = document.getElementById("loading-screen");

      try {
        nameBrands = await loadBrandList();

        const res = await fetch(`data/deals.json?v=${Date.now()}`);
        const json = await res.json();

        allDeals = enrichDeals(json.deals || []);

        renderSourceTabs();
        renderCategoryOptions();
        filterAndSort();

        setTimeout(() => {
          loading.style.opacity = "0";
          setTimeout(() => loading.style.display = "none", 500);
        }, 500);
      } catch (err) {
        console.error("App failed to initialize:", err);

        document.getElementById("deal-grid").innerHTML = `
          <div class="col-span-full bg-white rounded-2xl p-6 border-2 border-red-200">
            <h2 class="text-xl font-black text-red-600 mb-2">Failed to load deals</h2>
            <p class="text-slate-600 text-sm">Check that <code>data/deals.json</code> exists and is valid JSON.</p>
          </div>
        `;

        loading.style.display = "none";
      }
    }

    function filterAndSort() {
      const search = document.getElementById("searchBox").value.toLowerCase();
      const sort = document.getElementById("sortSelect").value;
      const sub = document.getElementById("subCatSelect").value;
      const tag = document.getElementById("tagFilter").value;

      const saved = getSavedDeals();
      const dealTags = getDealTags();

      let filtered = allDeals.filter(d => {
        const dealTag = dealTags[d.asin] || "none";

        const matchesSearch = d.title.toLowerCase().includes(search);
        const matchesStreamTab = currentSourceKey === "All" || d.category === currentSourceKey;
        const matchesDropdown = sub === "All" || d.category === sub;

        const matchesTag =
          tag === "All" ||
          (tag === "Brand" && d.isNameBrand) ||
          (tag === "Hot" && d.isHot) ||
          (tag === "Saved" && saved.includes(d.asin)) ||
          (tag === "Excellent" && dealTag === "excellent") ||
          (tag === "Good" && dealTag === "good") ||
          (tag === "Junk" && dealTag === "junk") ||
          (tag === "Untagged" && dealTag === "none");

        return matchesSearch && matchesStreamTab && matchesDropdown && matchesTag;
      });

      filtered.sort((a, b) => {
        if (sort === "score") return b.dealScore - a.dealScore;
        if (sort === "priceLow") return a.price - b.price;
        if (sort === "priceHigh") return b.price - a.price;
        if (sort === "rank") return a.rank - b.rank;
        if (sort === "rating") return b.rating - a.rating;
        if (sort === "reviews") return b.reviewCount - a.reviewCount;
        return b.dealScore - a.dealScore;
      });

      document.getElementById("deal-count").innerText = `${filtered.length} ITEMS`;

      document.getElementById("deal-grid").innerHTML = filtered.map(d => {
        const affiliateUrl = buildAffiliateUrl(d.asin);
        const currentTag = dealTags[d.asin] || "none";

        const tagBadge =
          currentTag !== "none"
            ? `<span class="bg-purple-600 text-white text-[9px] font-black px-2 py-1 rounded-lg">${currentTag.toUpperCase()}</span>`
            : "";

        return `
          <div class="deal-card bg-white rounded-[2rem] border-2 border-slate-200 p-5 flex flex-col relative ${d.isHot ? "hot-glow" : ""}">
            <button onclick="toggleBookmark('${d.asin}')" class="absolute top-4 right-4 z-20 text-2xl">
              ${saved.includes(d.asin) ? "★" : "☆"}
            </button>

            <div class="flex flex-wrap gap-1 mb-3 pr-8">
              ${d.isNameBrand ? '<span class="bg-slate-900 text-white text-[9px] font-black px-2 py-1 rounded-lg">★ BRAND</span>' : ""}
              ${d.isHot ? '<span class="bg-orange-500 text-white text-[9px] font-black px-2 py-1 rounded-lg">🔥 HOT</span>' : ""}
              ${tagBadge}
              ${d.category ? `<span class="bg-blue-100 text-blue-800 text-[9px] font-black px-2 py-1 rounded-lg">${d.category.replaceAll("_", " ").replaceAll(",", " + ").toUpperCase()}</span>` : ""}
            </div>

            <div class="h-40 flex items-center justify-center mb-4 bg-slate-50 rounded-2xl p-4 relative">
              ${d.img ? `<img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply" loading="lazy">` : '<div class="text-slate-400 text-xs font-bold">NO IMAGE</div>'}
              ${d.keepa ? `<a href="${d.keepa}" target="_blank" class="absolute bottom-2 right-2 bg-keepa text-white text-[9px] font-black px-3 py-1 rounded-lg">KEEPA ↗</a>` : ""}
            </div>

            <h3 class="font-bold text-lg h-20 overflow-hidden mb-4">${d.title}</h3>

            <div class="mb-4 bg-slate-50 p-4 rounded-2xl">
              <div class="flex justify-between items-center mb-2">
                <div>
                  <p class="text-[9px] text-slate-400 font-black">PRICE</p>
                  <p class="text-xl font-black">${money(d.price)}</p>
                </div>
                <div class="text-right">
                  <p class="text-[9px] text-slate-400 font-black">90d AVG</p>
                  <p class="text-sm line-through text-slate-300">${money(d.avg90)}</p>
                </div>
              </div>

              <div class="border-t pt-2 grid grid-cols-3 gap-2 text-center">
                <div>
                  <p class="text-[9px] font-black text-slate-400">SCORE</p>
                  <p class="text-lg font-black text-orange-600">${d.dealScore}</p>
                </div>
                <div>
                  <p class="text-[9px] font-black text-slate-400">RATING</p>
                  <p class="text-sm font-black">${d.rating ? d.rating.toFixed(1) : "N/A"}</p>
                </div>
                <div>
                  <p class="text-[9px] font-black text-slate-400">BSR</p>
                  <p class="text-sm font-black">${d.rank && d.rank !== 999999 ? d.rank.toLocaleString() : "N/A"}</p>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-4 gap-1 mb-2">
              <button onclick="setDealTag('${d.asin}', 'excellent')" class="${currentTag === "excellent" ? "ring-2 ring-green-900" : ""} bg-green-600 text-white text-[9px] font-black py-2 rounded-lg">BEST</button>
              <button onclick="setDealTag('${d.asin}', 'good')" class="${currentTag === "good" ? "ring-2 ring-blue-900" : ""} bg-blue-600 text-white text-[9px] font-black py-2 rounded-lg">GOOD</button>
              <button onclick="setDealTag('${d.asin}', 'junk')" class="${currentTag === "junk" ? "ring-2 ring-red-900" : ""} bg-red-600 text-white text-[9px] font-black py-2 rounded-lg">JUNK</button>
              <button onclick="setDealTag('${d.asin}', 'none')" class="bg-slate-300 text-slate-800 text-[9px] font-black py-2 rounded-lg">CLEAR</button>
            </div>

            <div class="space-y-2 mt-auto">
              <a href="${affiliateUrl}" target="_blank" class="block text-center bg-orange-600 text-white text-[10px] font-black py-3 rounded-xl uppercase">
                VIEW ON AMAZON
              </a>

              <button onclick="copyText('${affiliateUrl}', this)" class="w-full bg-slate-900 text-white text-[10px] font-black py-2 rounded-xl uppercase">
                COPY LINK
              </button>

              <button onclick="copyText('${d.asin}', this)" class="w-full bg-blue-600 text-white text-[9px] font-black py-2 rounded-xl uppercase">
                COPY ASIN
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function switchSource(key) {
      currentSourceKey = key;
      localStorage.setItem("lastUsedSource", key);

      document.getElementById("searchBox").value = "";
      document.getElementById("tagFilter").value = "All";
      document.getElementById("subCatSelect").value = "All";

      renderSourceTabs();
      filterAndSort();
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedSource = localStorage.getItem("lastUsedSource");
      if (savedSource) currentSourceKey = savedSource;
      init();
    });
  </script>
</body>
</html>
