<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WR Deal Command</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        /* THE ROBOTIC ARM ANIMATION */
        @keyframes robot-wave {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(15deg) translateY(-5px); }
            100% { transform: rotate(-5deg); }
        }
        .animate-robot { 
            animation: robot-wave 2s ease-in-out infinite; 
            transform-origin: bottom right;
        }

        /* LOADING BAR ANIMATION */
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .loading-bar { animation: progress 3s linear forwards; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .hot-glow { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); border-color: #f87171 !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

    <div id="version-tag">COMMAND V1.9.3</div>

    <!-- IMPROVED LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative w-48 h-48 mb-8 flex items-center justify-center">
            <!-- Ensure this file exists in your GitHub repo -->
            <img src="robot-arm.png" class="animate-robot w-32 h-32 drop-shadow-[0_0_20px_rgba(37,99,235,0.4)]">
        </div>
        <h2 class="text-white font-black italic text-3xl tracking-tighter uppercase mb-2">WR <span class="text-blue-500">Command</span></h2>
        <div class="w-48 h-1 bg-slate-800 rounded-full overflow-hidden">
            <div class="loading-bar h-full bg-blue-500"></div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-4 border-blue-600 px-4 py-4">
        <div class="max-w-[1800px] mx-auto flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 px-2 py-1 rounded-lg font-black italic text-xl">WR</div>
                    <h1 class="text-lg font-black uppercase italic tracking-tighter">Deal Command</h1>
                </div>
                <!-- INCREASED FONT SIZE FOR ITEM COUNT -->
                <p id="deal-count" class="text-sm font-black text-blue-300 uppercase bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">...</p>
            </div>
            
            <!-- REFINED SOURCE PILLS (No overflow) -->
            <div id="source-tabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar -mx-4 px-4"></div>

            <div class="flex gap-2">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." class="flex-grow bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2 text-white outline-none focus:border-blue-500">
                <select id="tagFilter" onchange="filterAndSort()" class="bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-yellow-500 outline-none font-bold text-sm">
                    <option value="All">All</option>
                    <option value="Brand">★ Brands</option>
                    <option value="Flash">⚡ Flash</option>
                    <option value="Hot">🔥 Hot</option>
                </select>
            </div>

            <div class="flex gap-2">
                <select id="sortSelect" onchange="filterAndSort()" class="flex-1 bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 font-bold text-white outline-none text-xs">
                    <option value="score">Score</option>
                    <option value="priceLow">Price: L to H</option>
                    <option value="priceHigh">Price: H to L</option>
                    <option value="rank">BSR</option>
                </select>
                <!-- CATEGORY FIX: RESTRICTED WIDTH -->
                <select id="subCatSelect" onchange="filterAndSort()" class="flex-1 max-w-[150px] bg-slate-800 border-2 border-slate-700 rounded-xl px-2 py-2 text-white outline-none text-xs truncate">
                    <option value="All">All Categories</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="max-w-[1800px] mx-auto px-4 mt-6">
        <div id="deal-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
    </main>

    <script>
        // Copy logic from previous V1.9.2, but update switchSource:
        function switchSource(key) {
            currentSourceKey = key;
            localStorage.setItem('lastUsedSource', key);
            
            // RESET ALL FILTERS ON SWITCH
            document.getElementById('searchBox').value = "";
            document.getElementById('tagFilter').value = "All";
            document.getElementById('subCatSelect').value = "All";
            
            init(); 
        }

        // Rest of your JS remains the same as 1.9.2 logic...
    </script>
</body>
</html>
