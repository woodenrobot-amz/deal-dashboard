<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wooden Robot | Command v1.5.1</title>
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .deal-card { transition: all 0.2s ease-in-out; }
        .deal-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-2 border-blue-600 px-6 py-4">
        <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 px-3 py-1 rounded-lg font-black italic tracking-tighter text-2xl text-white">WR</div>
                <div>
                    <h1 class="text-lg font-black tracking-tighter uppercase italic leading-none text-white">Deal <span class="text-blue-500">Command</span></h1>
                    <p id="deal-count" class="text-[9px] font-bold text-blue-300 uppercase tracking-widest mt-1 text-white">VALIDATING DATA...</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white outline-none w-48">
                <select id="sortSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none font-bold">
                    <option value="score">Sort: Score</option>
                    <option value="drop">Sort: % Drop</option>
                    <option value="rank">Sort: BSR</option>
                </select>
                <select id="subCatSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none max-w-[150px]">
                    <option value="All">All Categories</option>
                </select>
                <button onclick="resetHidden()" class="bg-red-900/20 text-red-400 border border-red-800 px-3 py-2 rounded-lg text-[10px] font-bold">RESET</button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-6 mt-8">
        <div id="deal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
    </main>
<script>
        let allDeals = [];

        // STRONGER CLEANER: Removes %, $, commas, and invisible spaces
        const forceNum = (val) => {
            if (val === null || val === undefined) return 0;
            // Removes everything except digits, decimal points, and minus signs
            const cleaned = String(val).replace(/[^0-9.-]/g, '');
            const parsed = parseFloat(cleaned);
            return isNaN(parsed) ? 0 : parsed;
        };

        const cleanUrl = (url) => {
            if (!url) return "";
            // Removes quotes and whitespace that often break links
            return url.replace(/["\s]/g, '').trim();
        };

        async function init() {
            try {
                const response = await fetch(`${CONFIG.CSV_URL}&cb=${Date.now()}`);
                const csvData = await response.text();
                const lines = csvData.split(/\r?\n/).filter(line => line.trim() !== "");
                const rows = lines.slice(1);
                
                const hiddenDeals = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
                const subCats = new Set();

                allDeals = rows.map((row) => {
                    // Splits by comma but ignores commas inside quotes
                    const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                    
                    if (!cols || cols.length < 14) return null;

                    const d = {
                        img: cleanUrl(cols[0]),
                        title: (cols[1] || "").replace(/"/g, ''),
                        price: forceNum(cols[2]),
                        avg90: forceNum(cols[3]),
                        drop1Day: forceNum(cols[4]), // This now safely ignores the %
                        isLow90: String(cols[5]).toUpperCase().includes('YES'),
                        isLowAll: String(cols[6]).toUpperCase().includes('YES'),
                        reviews: forceNum(cols[7]),
                        subCategory: (cols[8] || "General").replace(/"/g, '').trim(),
                        rank: forceNum(cols[10]),
                        url: cleanUrl(cols[11]),
                        keepaUrl: cleanUrl(cols[12]),
                        rating: forceNum(cols[13])
                    };

                    // Scoreboard Logic
                    let s = 0;
                    if (d.avg90 > 0 && d.price > 0) {
                        let pct = ((d.avg90 - d.price) / d.avg90) * 100;
                        if (pct > 100) pct = 100; 
                        s += (pct * (forceNum(CONFIG.WEIGHT_SAVINGS) || 1.5));
                    }
                    s += (d.rating * (forceNum(CONFIG.WEIGHT_RATING) || 5));
                    if (d.drop1Day >= 10) s += 40; else if (d.drop1Day >= 5) s += 20;
                    if (d.rank > 0 && d.rank <= 1000) s += 30;
                    if (d.isLow90 && d.isLowAll) s += 15;

                    d.dealScore = Math.floor(s);
                    if (d.subCategory) subCats.add(d.subCategory);
                    return d;
                }).filter(d => d !== null && d.price > 0 && d.url.includes('amazon.com') && !hiddenDeals.includes(d.url));

                // Populate Sub-Category Dropdown
                const menu = document.getElementById('subCatSelect');
                menu.innerHTML = '<option value="All">All Categories</option>';
                Array.from(subCats).sort().forEach(c => {
                    if(c) {
                        const opt = document.createElement('option');
                        opt.value = c; opt.innerText = c;
                        menu.appendChild(opt);
                    }
                });

                filterAndSort();
            } catch (err) { 
                console.error("Critical Failure:", err); 
            }
        }

        function handlePost(amazonUrl) {
            // Strips existing tracking and cleans the URL
            let cleanBase = amazonUrl.split('?')[0];
            if (!cleanBase.includes('amazon.com')) {
                alert("The Amazon link in your sheet appears to be invalid.");
                return;
            }
            const finalLink = `${cleanBase}?tag=${CONFIG.AFFILIATE_TAG}`;
            navigator.clipboard.writeText(finalLink).then(() => {
                alert("Affiliate Link Copied!");
            });
        }
        
        // ... include your existing filterAndSort, hideCard, and render functions ...
    </script>
    
</body>
</html>
