<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy's Selective Tool Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .deal-card { transition: transform 0.2s; }
        .deal-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header & Brand -->
    <nav class="bg-slate-900 text-white p-6 shadow-xl mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">WOODEN ROBOT <span class="text-blue-400">REVIEWS</span></h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest">Selective Deal Dashboard</p>
            </div>
            <div class="text-right">
                <span id="deal-count" class="bg-blue-600 px-3 py-1 rounded-full text-sm font-bold">Loading...</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pb-12">
        <!-- Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-8 flex flex-wrap gap-4 items-center justify-between border border-gray-200">
            <div class="flex gap-4 items-center">
                <input type="text" id="search" placeholder="Search by tool name..." 
                       class="border border-gray-300 rounded-lg px-4 py-2 w-72 focus:ring-2 focus:ring-blue-500 outline-none">
                
                <select id="filterType" class="border border-gray-300 rounded-lg px-4 py-2 bg-white outline-none">
                    <option value="all">All Quality Deals</option>
                    <option value="90day">90-Day Lows Only</option>
                    <option value="ytd">YTD Lows Only</option>
                </select>
            </div>

            <div class="text-sm text-gray-500">
                Minimum Quality: <span class="font-bold text-gray-800">4.2+ Stars</span>
            </div>
        </div>

        <!-- The Grid -->
        <div id="deal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1QglaKzDDE5441XFT9FAhJgp7lK75YqysOo1ctQbXI1-g46k10vPG9E5MoihGd4g9bsgBnuL2IoMu/pub?output=csv';

        async function init() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                // Use a regex or CSV parser if titles contain commas, 
                // but this simple split works for standard Keepa exports:
                const rows = data.split('\n').slice(1); 
                renderDeals(rows);
            } catch (error) {
                console.error("Error loading CSV:", error);
            }
        }

        function renderDeals(rows) {
            const grid = document.getElementById('deal-grid');
            const countLabel = document.getElementById('deal-count');
            grid.innerHTML = '';
            let count = 0;

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length < 5) return;

                // COLUMN MAPPING (Adjust these indices based on your Keepa Export column order)
                const asin = cols[0]?.trim();
                const title = cols[1]?.replace(/"/g, '');
                const currentPrice = parseFloat(cols[2]);
                const rating = parseFloat(cols[3]);
                const low90 = parseFloat(cols[4]);
                const isYTD = cols[5]?.toLowerCase().includes('true'); // Assuming col 6 is YTD check

                // SELECTIVE FILTERS
                if (rating < 4.2) return; // Ignore low quality items

                // Calculate Badge
                let badge = '';
                if (currentPrice <= low90) badge = '90-DAY LOW';
                if (isYTD) badge = 'YEAR LOW';
                
                // If it's not a significant long-term low, we skip it
                if (!badge && currentPrice > (low90 * 1.02)) return;

                count++;
                
                const card = `
                    <div class="deal-card bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                        <div class="relative p-4">
                            ${badge ? `<span class="absolute top-4 left-4 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md z-10">${badge}</span>` : ''}
                            <img src="https://images.amazon.com/images/P/${asin}.01.LZZZZZZZ.jpg" 
                                 class="w-full h-48 object-contain hover:scale-105 transition-transform duration-300"
                                 onerror="this.src='https://placehold.co/400x400?text=No+Image'">
                        </div>
                        
                        <div class="p-5 flex-grow flex flex-col">
                            <h3 class="text-gray-800 font-semibold text-sm leading-tight h-10 overflow-hidden mb-2">${title}</h3>
                            
                            <div class="flex items-center gap-1 mb-4">
                                <span class="text-yellow-500 text-sm">★</span>
                                <span class="text-sm font-bold text-gray-700">${rating}</span>
                            </div>

                            <div class="mt-auto">
                                <div class="flex justify-between items-end mb-4">
                                    <div>
                                        <p class="text-xs text-gray-400 uppercase font-bold tracking-tighter">Current Price</p>
                                        <p class="text-2xl font-black text-slate-900">$${currentPrice}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-tighter">90-Day Low</p>
                                        <p class="text-sm font-bold text-gray-500 italic">$${low90}</p>
                                    </div>
                                </div>

                                <a href="https://www.amazon.com/dp/${asin}?tag=YOUR_AFFILIATE_ID" target="_blank" 
                                   class="block w-full text-center bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-blue-600 transition-colors">
                                   View on Amazon
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });

            countLabel.innerText = `${count} Deals Found`;
        }

        init();
    </script>
</body>
</html>
