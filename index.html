    <script>
        let allDeals = [];

        // STRONGER CLEANER: Strips everything except digits and decimal points
        const forceNum = (val) => {
            if (val === null || val === undefined) return 0;
            const cleaned = String(val).replace(/[^0-9.-]/g, '');
            const parsed = parseFloat(cleaned);
            return isNaN(parsed) ? 0 : parsed;
        };

        async function init() {
            try {
                const response = await fetch(`${CONFIG.CSV_URL}&cb=${Date.now()}`);
                const csvData = await response.text();
                const lines = csvData.split(/\r?\n/).filter(line => line.trim() !== "");
                const rows = lines.slice(1);
                
                const hiddenDeals = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
                const subCats = new Set();

                // FORCE CONFIG TO NUMBERS
                const weightSavings = forceNum(CONFIG.WEIGHT_SAVINGS) || 1.5;
                const weightRating = forceNum(CONFIG.WEIGHT_RATING) || 5;

                allDeals = rows.map((row) => {
                    const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                    if (!cols || cols.length < 13) return null;

                    const d = {
                        img: (cols[0] || "").replace(/"/g, ''),
                        title: (cols[1] || "").replace(/"/g, ''),
                        price: forceNum(cols[2]),
                        avg90: forceNum(cols[3]),
                        drop1Day: forceNum(cols[4]),
                        isLow90: String(cols[5]).toUpperCase().includes('YES'),
                        isLowAll: String(cols[6]).toUpperCase().includes('YES'),
                        reviews: forceNum(cols[7]),
                        subCategory: (cols[8] || "General").replace(/"/g, '').trim(),
                        rank: forceNum(cols[10]),
                        url: (cols[11] || "").replace(/"/g, '').trim(),
                        keepaUrl: (cols[12] || "#").replace(/"/g, '').trim(),
                        rating: forceNum(cols[13])
                    };

                    // --- THE REWRITTEN MATH ENGINE ---
                    let finalScore = 0;

                    // 1. Savings Score
                    if (d.avg90 > 0 && d.price > 0) {
                        const savingsPct = ((d.avg90 - d.price) / d.avg90) * 100;
                        finalScore += (savingsPct * weightSavings);
                    }

                    // 2. Rating Score
                    finalScore += (d.rating * weightRating);

                    // 3. Flash Boost
                    if (d.drop1Day >= 10) finalScore += 40;
                    else if (d.drop1Day >= 5) finalScore += 20;

                    // 4. Rank Boost
                    if (d.rank > 0 && d.rank <= 500) finalScore += 35;
                    else if (d.rank > 0 && d.rank <= 2000) finalScore += 20;

                    // 5. Bonus Points
                    if (d.reviews >= 1000) finalScore += 10;
                    if (d.isLow90 && d.isLowAll) finalScore += 15;

                    // FORCE THE FINAL RESULT TO A ROUNDED NUMBER
                    d.dealScore = Math.floor(Number(finalScore));

                    if (d.subCategory) subCats.add(d.subCategory);
                    return d;
                }).filter(d => d !== null && d.rating >= (CONFIG.MIN_RATING || 4.0) && !hiddenDeals.includes(d.url));

                // Populate Dropdown
                const menu = document.getElementById('subCatSelect');
                menu.innerHTML = '<option value="All">All Categories</option>';
                Array.from(subCats).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    menu.appendChild(opt);
                });

                filterAndSort();
            } catch (err) { console.error("Load Error:", err); }
        }

        function filterAndSort() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const sub = document.getElementById('subCatSelect').value;
            
            let filtered = allDeals.filter(d => 
                (d.title.toLowerCase().includes(search) || d.subCategory.toLowerCase().includes(search)) && 
                (sub === "All" || d.subCategory === sub)
            );

            if (sort === "score") filtered.sort((a,b) => b.dealScore - a.dealScore);
            if (sort === "drop") filtered.sort((a,b) => b.drop1Day - a.drop1Day);
            if (sort === "rank") filtered.sort((a,b) => (a.rank || 999999) - (b.rank || 999999));

            render(filtered);
        }

        function handlePost(amazonUrl) {
            const baseUrl = amazonUrl.split('?')[0];
            const finalLink = `${baseUrl}?tag=${CONFIG.AFFILIATE_TAG}`;
            navigator.clipboard.writeText(finalLink).then(() => alert("Copied Affiliate Link!"));
        }

        function hideCard(url) {
            let hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            hidden.push(url);
            localStorage.setItem('hiddenDeals', JSON.stringify(hidden));
            location.reload();
        }

        function resetHidden() { localStorage.removeItem('hiddenDeals'); location.reload(); }

        function render(deals) {
            const grid = document.getElementById('deal-grid');
            document.getElementById('deal-count').innerText = `${deals.length} DEALS IDENTIFIED`;
            
            if (deals.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold uppercase tracking-widest">No deals matching filters.</div>`;
                return;
            }

            grid.innerHTML = deals.map(d => `
                <div class="deal-card bg-white rounded-3xl border border-slate-200 p-5 flex flex-col relative shadow-sm hover:shadow-xl">
                    <button onclick="hideCard('${d.url}')" class="absolute top-3 right-3 z-30 bg-white/90 hover:bg-red-500 hover:text-white w-7 h-7 rounded-full text-[10px] shadow flex items-center justify-center transition-all font-bold text-slate-400">✕</button>
                    
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[9px] font-black text-blue-600 uppercase truncate max-w-[100px]">${d.subCategory}</span>
                        <div class="flex gap-1">
                            ${d.drop1Day >= 5 ? '<span class="bg-yellow-400 text-yellow-900 text-[8px] font-black px-1.5 py-0.5 rounded uppercase flex items-center gap-1">⚡ FLASH</span>' : ''}
                            ${d.isLowAll ? '<span class="bg-red-100 text-red-600 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Year Low</span>' : ''}
                        </div>
                    </div>

                    <div class="h-32 flex items-center justify-center mb-4 bg-slate-50 rounded-xl p-2 relative">
                        <a href="${d.keepaUrl}" target="_blank" class="absolute bottom-2 right-2 bg-slate-900 text-white text-[8px] px-2 py-1 rounded hover:bg-blue-600 transition-all font-bold">KEEPA ↗</a>
                        <img src="${d.img}" class="max-h-full max-w-full object-contain mix-blend-multiply" onerror="this.src='https://via.placeholder.com/150?text=No+Img'">
                    </div>

                    <h3 class="font-bold text-xs leading-tight h-8 overflow-hidden mb-3 text-slate-800">${d.title}</h3>
                    
                    <div class="grid grid-cols-2 gap-2 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <div><p class="text-[8px] text-slate-400 uppercase font-bold">Price</p><p class="text-xl font-black text-slate-900">$${d.price.toFixed(2)}</p></div>
                        <div class="text-right"><p class="text-[8px] text-slate-400 uppercase font-bold">90d Avg</p><p class="text-sm font-bold text-slate-400 line-through tracking-tighter">$${d.avg90.toFixed(2)}</p></div>
                        <div class="mt-1"><p class="text-[8px] text-slate-400 uppercase font-bold">1d Drop</p><p class="text-[10px] font-bold text-blue-600">${d.drop1Day}%</p></div>
                        <div class="text-right mt-1"><p class="text-[8px] text-slate-400 uppercase font-bold">Score</p><p class="text-[10px] font-black text-orange-600">${d.dealScore}</p></div>
                    </div>

                    <button onclick="handlePost('${d.url}')" class="w-full bg-slate-900 text-white text-xs font-black py-3 rounded-xl hover:bg-blue-600 transition-all shadow-lg active:scale-95">COPY AFFILIATE LINK</button>
                </div>
            `).join('');
        }
        init();
    </script>
