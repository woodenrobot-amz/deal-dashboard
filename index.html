<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wooden Robot Deals</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --text: #f2f4f8;
      --muted: #9aa4b2;
      --border: #2b3240;
      --accent: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --good: #22c55e;
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 17, 21, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 14px 10px;
    }

    .top-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .deal-count {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    #searchInput {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      outline: none;
      font-size: 1rem;
    }

    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
    }

    #clearSearchBtn {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      line-height: 1;
    }

    #clearSearchBtn:hover {
      color: var(--text);
      background: #2a3140;
    }

    .filter-section {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-section::-webkit-scrollbar { display: none; }

    .tag-pill {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.88rem;
    }

    .tag-pill.active {
      background: var(--accent);
      color: #16100a;
      border-color: var(--accent);
      font-weight: 700;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 14px 90px;
    }

    .toolbar {
      position: sticky;
      top: 132px;
      z-index: 12;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin: -4px 0 12px;
      padding: 8px 0;
      background: rgba(15, 17, 21, 0.96);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font-size: 0.86rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar button,
    .toolbar select {
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--panel);
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.84rem;
    }

    .toolbar select {
      padding-right: 24px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%239aa4b2' d='M0 0h10L5 6z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }

    .toolbar button:hover,
    .toolbar select:hover { color: var(--text); border-color: var(--muted); }

    .toolbar button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #16100a;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .deal-card {
      position: relative;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card-menu-button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(43, 50, 64, 0.6);
      border-radius: 999px;
      background: rgba(23, 26, 33, 0.88);
      color: var(--text);
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .card-menu-button:hover {
      background: var(--panel-2);
      border-color: var(--accent);
    }

    .card-menu-button.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.7);
      color: #fbbf24;
    }

    .image-wrap {
      aspect-ratio: 4 / 3;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      max-height: 205px;
      overflow: hidden;
    }

    .image-wrap img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      margin: auto;
    }

    .card-body { padding: 12px; }

    .title {
      margin: 0 0 8px;
      font-size: 0.96rem;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.6em;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .price-stack {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .price {
      color: var(--good);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .avg-price {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 8px;
      margin-top: 4px;
      white-space: nowrap;
    }

    .score-post {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.55);
      color: #86efac;
    }

    .score-strong {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.55);
      color: #fbbf24;
    }

    .score-maybe {
      background: rgba(148, 163, 184, 0.14);
      border-color: rgba(148, 163, 184, 0.35);
      color: #cbd5e1;
    }

    .score-weak {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fecaca;
    }

    .asin {
      color: var(--muted);
      font-size: 0.75rem;
      text-align: right;
      word-break: break-all;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 9px 0 12px;
    }

    .mini-tag {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.74rem;
    }

    .mini-tag-spc {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.62);
      color: #fbbf24;
      font-weight: 800;
    }

    .deal-details {
      display: none;
      margin: 0 12px 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(31, 36, 48, 0.72);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .deal-card.details-open .deal-details {
      display: block;
    }

    .details-title {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .detail-row,
    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .detail-row span:first-child,
    .score-row span:first-child {
      color: var(--muted);
    }

    .detail-row span:last-child,
    .score-row span:last-child {
      color: var(--text);
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .score-breakdown {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 8px;
    }

    .score-breakdown-title {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .score-row {
      padding: 3px 0;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .actions a,
    .actions button {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 9px 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.84rem;
      line-height: 1.15;
    }

    .buy-btn {
      color: #17110a;
      background: var(--accent);
      border-color: var(--accent) !important;
    }

    .copy-btn,
    .bookmark-btn,
    .hide-btn {
      background: var(--panel-2);
      color: var(--text);
    }

    .bookmark-btn.active {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.65) !important;
      color: #fbbf24;
    }

    .junk-btn {
      grid-column: 1 / -1;
      background: var(--danger-bg);
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.35) !important;
    }

    .empty-state {
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      padding: 32px 18px;
      text-align: center;
      background: rgba(255,255,255,0.02);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #111827;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
      z-index: 40;
      display: none;
      max-width: calc(100% - 28px);
      text-align: center;
      font-size: 0.9rem;
    }

    @media (min-width: 760px) {
      header { padding: 16px 22px 12px; }
      main { padding: 20px 22px 100px; }
      h1 { font-size: 1.35rem; }
      .toolbar { top: 142px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <h1>Wooden Robot Deals</h1>
      <div class="deal-count" id="dealCount">0 deals</div>
    </div>

    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search deals, brands, ASINs..." autocomplete="off">
      <button id="clearSearchBtn" type="button" aria-label="Clear search">×</button>
    </div>

    <div class="filter-section" id="tagFilters" aria-label="Filter by tag"></div>
  </header>

  <main>
    <div class="toolbar">
      <span id="activeFilterLabel">Showing all tags</span>
      <div class="toolbar-actions">
        <select id="sortBySelect" aria-label="Sort options">
          <option value="dealScore">Deal Score</option>
          <option value="priceHL">Price: H-L</option>
          <option value="priceLH">Price: L-H</option>
          <option value="newest">Newest Add</option>
          <option value="bsr">BSR</option>
        </select>
        <button id="showBookmarksBtn" type="button">Bookmarks</button>
        <button id="copyIgnoredBtn" type="button">Copy Ignored</button>
        <button id="showIgnoredBtn" type="button">Ignored ASINs</button>
      </div>
    </div>

    <section id="dealGrid" class="grid"></section>
    <section id="emptyState" class="empty-state" style="display:none;">No matching deals found.</section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEYS = {
      ignoredAsins: "woodenRobot.ignoredAsins.v1",
      hiddenAsins: "woodenRobot.hiddenAsins.v1",
      bookmarkedAsins: "woodenRobot.bookmarkedAsins.v1",
      selectedTag: "woodenRobot.selectedTag.v1",
      sortBy: "woodenRobot.sortBy.v1"
    };

    const state = {
      deals: [],
      search: "",
      selectedTag: localStorage.getItem(STORAGE_KEYS.selectedTag) || "All",
      sortBy: localStorage.getItem(STORAGE_KEYS.sortBy) || "dealScore",
      showBookmarksOnly: false,
      ignoredAsins: loadSet(STORAGE_KEYS.ignoredAsins),
      hiddenAsins: loadSet(STORAGE_KEYS.hiddenAsins),
      bookmarkedAsins: loadSet(STORAGE_KEYS.bookmarkedAsins)
    };

    const els = {
      searchInput: document.getElementById("searchInput"),
      clearSearchBtn: document.getElementById("clearSearchBtn"),
      tagFilters: document.getElementById("tagFilters"),
      dealGrid: document.getElementById("dealGrid"),
      emptyState: document.getElementById("emptyState"),
      dealCount: document.getElementById("dealCount"),
      activeFilterLabel: document.getElementById("activeFilterLabel"),
      sortBySelect: document.getElementById("sortBySelect"),
      showBookmarksBtn: document.getElementById("showBookmarksBtn"),
      copyIgnoredBtn: document.getElementById("copyIgnoredBtn"),
      showIgnoredBtn: document.getElementById("showIgnoredBtn"),
      toast: document.getElementById("toast")
    };

    init();

    async function init() {
      // Set initial drop-down selection from state
      els.sortBySelect.value = state.sortBy;
      bindEvents();
      state.deals = normalizeDeals(await getDeals());
      render();
    }

    function bindEvents() {
      els.searchInput.addEventListener("input", function(event) {
        state.search = event.target.value.trim().toLowerCase();
        els.clearSearchBtn.style.display = state.search ? "block" : "none";
        renderDeals();
      });

      els.searchInput.addEventListener("keydown", function(event) {
        if (event.key === "Escape") clearSearch();
      });

      els.clearSearchBtn.addEventListener("click", clearSearch);

      els.sortBySelect.addEventListener("change", function(event) {
        state.sortBy = event.target.value;
        localStorage.setItem(STORAGE_KEYS.sortBy, state.sortBy);
        renderDeals();
      });

      els.showBookmarksBtn.addEventListener("click", function() {
        state.showBookmarksOnly = !state.showBookmarksOnly;
        els.showBookmarksBtn.classList.toggle("active", state.showBookmarksOnly);
        renderDeals();
      });

      els.copyIgnoredBtn.addEventListener("click", async function() {
        const ignored = Array.from(state.ignoredAsins).sort();
        if (!ignored.length) {
          showToast("No ignored ASINs to copy.");
          return;
        }

        const output = JSON.stringify(ignored, null, 2);
        await copyToClipboard(output);
        showToast("Copied ignored ASIN list as JSON.");
      });

      els.showIgnoredBtn.addEventListener("click", function() {
        const ignored = Array.from(state.ignoredAsins).sort();
        if (!ignored.length) {
          showToast("No ignored ASINs yet.");
          return;
        }

        const message = ["Ignored ASINs:", "", ignored.join(String.fromCharCode(10)), "", "Tip: use Copy Ignored to paste this list into ChatGPT for search tuning.", "", "Restore all ignored ASINs?"].join(String.fromCharCode(10));
        const restore = confirm(message);

        if (restore) {
          state.ignoredAsins.clear();
          saveSet(STORAGE_KEYS.ignoredAsins, state.ignoredAsins);
          showToast("Ignored ASIN list cleared.");
          render();
        }
      });
    }

    async function getDeals() {
      if (Array.isArray(window.DEALS)) return window.DEALS;

      try {
        const response = await fetch("./data/deals.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Failed to fetch deals");
        const data = await response.json();
        if (Array.isArray(data)) return data;
        if (Array.isArray(data.deals)) return data.deals;
        return [];
      } catch (error) {
        console.error(error);
        showToast("Could not load deals.json");
        return [];
      }
    }

    function normalizeDeals(deals) {
      return deals.filter(Boolean).map(function(deal) {
        const asin = String(deal.asin || deal.ASIN || "").trim();
        const sources = normalizeSources(deal.sources || deal.source || []);
        const spcImported = Boolean(
          deal.spcImported ||
          deal.inSponsoredProductsPool ||
          deal.sponsoredProductsCreator ||
          sources.includes("sponsored_products_creators")
        );
        const tags = normalizeTags(
          []
            .concat(
              deal.tags ||
              deal.tag ||
              deal.categories ||
              deal.category ||
              deal.stream ||
              deal.dealStream ||
              []
            )
            .concat(spcImported ? ["SPC Op"] : [])
        );
        const price = firstValidNumber(deal.price, deal.currentPrice, deal.buyBoxPrice, deal.salePrice, deal.dealPrice);
        const avg90 = getAvg90(deal);

        return Object.assign({}, deal, {
          asin: asin,
          title: deal.title || deal.name || "Untitled deal",
          price: price,
          avg90: avg90,
          image: deal.image || deal.imageUrl || deal.img || "",
          url: deal.url || deal.amazonUrl || deal.link || asinToAmazonUrl(asin),
          brand: deal.brand || "",
          sources: sources,
          spcImported: spcImported,
          spcCapturedAt: deal.spcCapturedAt || deal.capturedAt || "",
          tags: tags,
          score: firstValidNumber(deal.score, deal.dealScore, deal.powerScore),
          scoreBreakdown: deal.scoreBreakdown || {},
          parentAsin: String(deal.parentAsin || "").trim(),
          familyKey: String(deal.familyKey || deal.parentAsin || asin).trim(),
          variationCount: firstValidNumber(deal.variationCount, deal.variations, deal.variationTotal),
          productAgeDays: firstValidNumber(deal.productAgeDays, deal.trackingDays, deal.daysTracked, deal.keepaTrackingDays),
          reviewCount: firstValidNumber(deal.reviewCount, deal.reviews, deal.ratingCount),
          salesRank: firstValidNumber(deal.salesRank, deal.currentSalesRank, deal.rank),
          trackingDays: firstValidNumber(deal.trackingDays, deal.daysTracked, deal.keepaTrackingDays, deal.productAgeDays)
        });
      }).filter(function(deal) {
        return deal.asin;
      }).map(function(deal) {
        if (deal.score === null) deal.score = scoreDeal(deal);
        return deal;
      });
    }

    function getAvg90(deal) {
      const candidates = [
        deal.avg90,
        deal.average90,
        deal.avg90Price,
        deal.avg90DayPrice,
        deal.ninetyDayAverage,
        deal.ninetyDayAvg
      ];

      if (deal.stats) {
        candidates.push(deal.stats.avg90);
        if (deal.stats.current) candidates.push(deal.stats.current.avg90);
      }

      if (deal.keepa) {
        candidates.push(deal.keepa.avg90);
        if (deal.keepa.stats) candidates.push(dea
