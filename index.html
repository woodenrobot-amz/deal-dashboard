<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wooden Robot | Command v1.4.4</title>
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .deal-card { transition: all 0.2s ease-in-out; }
        .deal-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-2xl border-b-2 border-blue-600 px-6 py-4">
        <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 px-3 py-1 rounded-lg font-black italic tracking-tighter text-2xl text-white">WR</div>
                <div>
                    <h1 class="text-lg font-black tracking-tighter uppercase italic leading-none text-white">Deal <span class="text-blue-500">Command</span></h1>
                    <p id="deal-count" class="text-[9px] font-bold text-blue-300 uppercase tracking-widest mt-1 text-white">READY</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <input type="text" id="searchBox" onkeyup="filterAndSort()" placeholder="Search..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none w-48">
                <select id="sortSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                    <option value="score">Sort: Score</option>
                    <option value="drop">Sort: % Drop</option>
                </select>
                <select id="subCatSelect" onchange="filterAndSort()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none">
                    <option value="All">All Categories</option>
                </select>
                <button onclick="resetHidden()" class="bg-red-900/20 text-red-400 border border-red-800 px-3 py-2 rounded-lg text-[10px] font-bold">RESET</button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto px-6 mt-8">
        <div id="deal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
            <!-- Cards -->
        </div>
    </main>

    <script>
        let allDeals = [];

        async function init() {
            try {
                const response = await fetch(`${CONFIG.CSV_URL}&cb=${Date.now()}`);
                const csvData = await response.text();
                const lines = csvData.split(/\r?\n/).filter(line => line.trim() !== "");
                
                // DATA DEBUGGER: This helps us see if the columns shifted
                const headers = lines[0].split(',');
                console.log("Headers detected:", headers);

                const rows = lines.slice(1);
                const hiddenDeals = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
                const subCats = new Set();

                allDeals = rows.map((row, i) => {
                    // This is a "greedy" comma splitter that respects quotes
                    const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    
                    if (!cols || cols.length < 10) return null; 

                    const d = {
                        img: cols[0]?.replace(/"/g, ''),
                        title: cols[1]?.replace(/"/g, ''),
                        price: parseFloat(cols[2]?.replace(/[$,]/g, '')) || 0,
                        avg90: parseFloat(cols[3]?.replace(/[$,]/g, '')) || 0,
                        drop1Day: parseFloat(cols[4]?.replace(/[%,]/g, '') || 0),
                        isLow90: String(cols[5]).toUpperCase().includes('TRUE'),
                        isLowAll: String(cols[6]).toUpperCase().includes('TRUE'),
                        reviews: parseInt(cols[7]?.replace(/[,]/g, '') || 0),
                        subCategory: cols[8]?.replace(/"/g, '').trim() || 'General',
                        lastChange: cols[9],
                        rank: parseInt(cols[10]?.replace(/[,#]/g, '') || 0),
                        url: cols[11]?.replace(/"/g, '').trim(),
                        keepaUrl: cols[12]?.replace(/"/g, '').trim() || '#',
                        rating: parseFloat(cols[13]) || 0
                    };

                    const savingsPct = d.avg90 > 0 ? ((d.avg90 - d.price) / d.avg90) * 100 : 0;
                    let score = (savingsPct * (CONFIG.WEIGHT_SAVINGS || 1.5)) + (d.rating * (CONFIG.WEIGHT_RATING || 5));
                    if (d.drop1Day >= 10) score += 40;
                    if (d.rank > 0 && d.rank <= 1000) score += 25;
                    if (d.isLow90 && d.isLowAll) score += 15;

                    d.dealScore = Math.round(score);
                    if (d.subCategory) subCats.add(d.subCategory);
                    return d;
                }).filter(d => d !== null && !hiddenDeals.includes(d.url));

                // Populate Menu
                const menu = document.getElementById('subCatSelect');
                Array.from(subCats).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    menu.appendChild(opt);
                });

                filterAndSort();
            } catch (err) { console.error("Load Failed:", err); }
        }

        function filterAndSort() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;
            const sub = document.getElementById('subCatSelect').value;
            
            let filtered = allDeals.filter(d => 
                d.title.toLowerCase().includes(search) && (sub === "All" || d.subCategory === sub)
            );

            if (sort === "score") filtered.sort((a,b) => b.dealScore - a.dealScore);
            if (sort === "drop") filtered.sort((a,b) => b.drop1Day - a.drop1Day);
            
            render(filtered);
        }

        function handlePost(url) {
            const final = `${url.split('?')[0]}?tag=${CONFIG.AFFILIATE_TAG}`;
            navigator.clipboard.writeText(final).then(() => alert("Copied!"));
        }

        function hideCard(url) {
            let hidden = JSON.parse(localStorage.getItem('hiddenDeals') || '[]');
            hidden.push(url);
            localStorage.setItem('hiddenDeals', JSON.stringify(hidden));
            location.reload();
        }

        function resetHidden() { localStorage.removeItem('hiddenDeals'); location.reload(); }

        function render(deals) {
            const grid = document.getElementById('deal-grid');
            document.getElementById('deal-count').innerText = `${deals.length} DEALS ACTIVE`;
            grid.innerHTML = deals.map(d => `
                <div class="deal-card bg-white rounded-3xl border p-5 flex flex-col relative shadow-sm">
                    <button onclick="hideCard('${d.url}')" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 font-bold">✕</button>
                    <div class="flex justify-between mb-2">
                        <span class="text-[9px] font-black text-blue-600 uppercase truncate max-w-[100px]">${d.subCategory}</span>
                        <div class="flex gap-1">
                            ${d.drop1Day >= 5 ? '<span class="bg-yellow-400 text-[8px] px-1 rounded font-black">⚡ FLASH</span>' : ''}
                            ${d.isLowAll ? '<span class="bg-red-100 text-red-600 text-[8px] px-1 rounded font-black uppercase">Year</span>' : ''}
                        </div>
                    </div>
                    <div class="h-32 flex items-center justify-center mb-4"><img src="${d.img}" class="max-h-full"></div>
                    <h3 class="font-bold text-xs h-8 overflow-hidden mb-3 text-slate-800">${d.title}</h3>
                    <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl mb-4">
                        <div><p class="text-[8px] text-slate-400 uppercase">Now</p><p class="text-xl font-black">$${d.price.toFixed(2)}</p></div>
                        <div class="text-right"><p class="text-[8px] text-slate-400 uppercase">Score</p><p class="text-[10px] font-black text-orange-600">${d.dealScore}</p></div>
                    </div>
                    <button onclick="handlePost('${d.url}')" class="w-full bg-slate-900 text-white text-xs font-black py-3 rounded-xl">COPY LINK</button>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
